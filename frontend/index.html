  let thumbCtls=[];

  window.mountSetup=function(){
    startThumbs();
  };

  window.unmountSetup=function(){
    // ekran dışındayken 14 önizleme canvas'ının rAF döngüleri durdurulur
    thumbCtls.forEach(c=>c.setEnabled&&c.setEnabled(false));
  };

  function startThumbs(){
    thumbCtls.forEach(c=>c.destroy&&c.destroy());
    thumbCtls=[];
    $$(".fx-thumb").forEach(cv=>{
      const ctl=makeEffectController(cv);
      ctl.setEffect(cv.dataset.fxname, 22, 1.4);
      ctl.setEnabled(true);
      thumbCtls.push(ctl);
    });
  }

  // ---- live update helpers ----
  function liveTheme(){
    applyTheme({colors:CONFIG.theme.colors, radius:CONFIG.theme.radius, glow:CONFIG.theme.glow,
      mode: modeForBg(CONFIG.theme.colors.bg)});
  }

  window.wireSetup=function(){
    const root=$("#screen-setup"); if(!root) return;

    // marka
    $("#suName",root).oninput=e=>{ CONFIG.jam.name=e.target.value;
      $$("[data-t-text='jamname']").forEach(n=>n.textContent=e.target.value); };
    $("#suTag",root).oninput=e=>{ CONFIG.jam.tagline=e.target.value;
      $$("[data-t-text='jamtag']").forEach(n=>n.textContent=e.target.value); };
    $("#suNameSize",root).oninput=e=>{ CONFIG.jam.nameSize=+e.target.value;
      document.documentElement.style.setProperty("--name-size", e.target.value+"px");
      $("#suNameSizeVal").textContent=e.target.value+"px"; };
    $("#suTagSize",root).oninput=e=>{ CONFIG.jam.taglineSize=+e.target.value;
      document.documentElement.style.setProperty("--tag-size", e.target.value+"px");
      $("#suTagSizeVal").textContent=e.target.value+"px"; };
    $("#suNameFont",root).onchange=e=>{ CONFIG.jam.nameFont=e.target.value;
      document.documentElement.style.setProperty("--name-font", e.target.value||"var(--font-display)");
      e.target.style.fontFamily="var(--name-font)"; };
    $("#suTagFont",root).onchange=e=>{ CONFIG.jam.taglineFont=e.target.value;
      document.documentElement.style.setProperty("--tag-font", e.target.value||"var(--font-body)");
      e.target.style.fontFamily="var(--tag-font)"; };
    $("#dzLogo",root).onclick=()=>Bridge.pickImage("logo").then(r=>{ if(!r||!r.dataUrl) return;
      CONFIG.jam.logo=r.dataUrl;
      $("#dzLogo").innerHTML=dzInner(r.dataUrl,"dz_logo_t","dz_logo_s");
      if(window.__refreshBrand) window.__refreshBrand(); });
    $("#dzBg",root).onclick=()=>Bridge.pickImage("background").then(r=>{ if(!r||!r.dataUrl) return;
      CONFIG.jam.background=r.dataUrl;
      $("#dzBg").innerHTML=dzInner(r.dataUrl,"dz_bg_t","dz_bg_s"); });

    // tema presetleri
    $$("[data-preset]",root).forEach(b=>b.onclick=()=>{
      const key=b.dataset.preset; CONFIG.theme=themeFromPreset(key,CONFIG.theme);
      $$("[data-preset]",root).forEach(x=>x.classList.toggle("selected",x===b));
      liveTheme(); refreshColorInputs();
    });

    // özel renkler
    $$("[data-col]",root).forEach(inp=>inp.oninput=e=>{
      const f=e.target.dataset.col; CONFIG.theme.colors[f]=e.target.value; CONFIG.theme.preset="custom";
      // türetilenler: surface2/border yüzeyden, bg2 arka plandan; accent değişince ink yeniden türesin
      if(f==="surface"){ CONFIG.theme.colors.surface2=e.target.value; CONFIG.theme.colors.border=e.target.value; }
      if(f==="bg") CONFIG.theme.colors.bg2=e.target.value;
      if(f==="accent") delete CONFIG.theme.colors.accentInk;
      const hex=$(`[data-col-hex="${f}"]`); if(hex)hex.textContent=e.target.value;
      $$("[data-preset]",root).forEach(x=>x.classList.remove("selected"));
      liveTheme();
    });

    // radius / glow
    $("#suRadius",root).oninput=e=>{ CONFIG.theme.radius=+e.target.value;
      $("#suRadiusVal").textContent=e.target.value+"px"; liveTheme(); };
    $("#suGlow",root).oninput=e=>{ CONFIG.theme.glow=+e.target.value;
      $("#suGlowVal").textContent=Math.round(e.target.value*30)+"%"; liveTheme(); };

    // efekt — değişiklik DİSKE de yazılır (dil gibi oto-kaydet) ki tarayıcı/OBS
    // sayaç sayfası (config'i diskten okur) seçilen efekti anında göstersin.
    $("#suFxOn",root).onchange=e=>{ CONFIG.effect.enabled=e.target.checked;
      if(effectCtl)effectCtl.setEnabled(e.target.checked); Bridge.saveConfig(CONFIG); };
    $$("[data-fx]",root).forEach(b=>b.onclick=()=>{ const k=b.dataset.fx; CONFIG.effect.name=k;
      $$("[data-fx]",root).forEach(x=>x.classList.toggle("selected",x===b));
      if(effectCtl)effectCtl.setEffect(k,CONFIG.effect.intensity,1); Bridge.saveConfig(CONFIG); });
    $("#suFxInt",root).oninput=e=>{ CONFIG.effect.intensity=+e.target.value;
      if(effectCtl)effectCtl.setIntensity(+e.target.value); };
    $("#suFxInt",root).onchange=()=>Bridge.saveConfig(CONFIG);   // sürükleme bitince kaydet (oninput'u spam'lama)

    // dil
    $("#suLang",root).onchange=e=>{ setLanguage(e.target.value); CONFIG.jam.language=LANG; Bridge.saveConfig(CONFIG); };

    // davranış
    $("#suMin",root).oninput=e=>CONFIG.launcher.defaultMinutes=+e.target.value;
    $("#suTimeup",root).onchange=e=>CONFIG.launcher.onTimeUp=e.target.value;
    $("#suKill",root).oninput=e=>CONFIG.launcher.killDelay=+e.target.value;
    $("#suKiosk",root).onchange=e=>CONFIG.launcher.kioskLock=e.target.checked;
    $("#suTimer",root).onchange=e=>CONFIG.launcher.timerOverlay=e.target.checked;

    // yollar
    $("#suChangeDir",root).onclick=()=>Bridge.selectGamesFolder().then(r=>{ if(r&&r.path){ CONFIG.paths.gamesDir=r.path; $("#suDir").textContent=r.path; Bridge.saveConfig(CONFIG); } });
    $("#suOpenDir",root).onclick=()=>Bridge.openGamesFolder();

    // kaydet çubuğu
    $("#suSave",root).onclick=()=>Bridge.saveConfig(CONFIG).then(()=>toast(t("saved_ok"),"success"));
    $("#suReset",root).onclick=()=>modal({title:t("reset_q"),body:t("reset_sub"),danger:true,onConfirm:()=>
      Bridge.resetConfig().then(c=>{ CONFIG=c; LANG=c.jam.language; applyConfig(CONFIG); applyEffectFromConfig();
        rebuildSetup(); toast(t("reset_ok"),"info"); })});
    $("#suExport",root).onclick=()=>Bridge.exportConfig().then(r=>{
      if(r && r.data){
        const blob=new Blob([r.data],{type:"application/json"});
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
        a.download="jam_config.json"; a.click(); URL.revokeObjectURL(a.href);
      } else if(r && r.ok===false){ return; }
      toast(t("exported_ok"),"info");
    });
    $("#suImport",root).onclick=()=>Bridge.importConfig().then(c=>{
      if(!c || !c.jam){ if(c && c.error) toast(c.error,"error"); return; }
      CONFIG=c; LANG=c.jam.language||LANG; applyConfig(CONFIG); applyEffectFromConfig();
      rebuildSetup(); toast(t("saved_ok"),"success");
    });

    wireUpdateCard(root);
  };

  // ---- güncelleme kartı ----
  let updFound=null, updListenersOn=false;
  function updErrMsg(code){
    const map={no_repo:"upd_no_repo", no_release:"upd_err_no_release", rate_limit:"upd_err_rate",
               network:"upd_err_network", bad_zip:"upd_err_bad_zip", dev_mode:"upd_dev_hint",
               no_zip:"upd_err_no_zip"};
    return t(map[code]||"upd_err_network");
  }
  function setUpdResult(msg){ const el=$("#suUpdResult"); if(el) el.textContent=msg||""; }
  function showUpdFound(r){
    updFound=r;
    const notes=(r.notes||"").trim();
    setUpdResult(`${t("upd_found")} ${r.latest}`+(notes?`\n${t("upd_notes")}: ${notes.slice(0,220)}`:""));
    const host=$("#suUpdAction"); if(!host) return;
    host.innerHTML=`
      <button class="btn btn-primary" id="suUpdInstall" style="width:100%"><span class="btn-spinner"></span><span class="btn-txt">${t("upd_install")}</span></button>
      <div id="suUpdBarWrap" style="display:none;height:8px;border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-top:8px">
        <i id="suUpdBar" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2))"></i></div>`;
    $("#suUpdInstall").onclick=()=>{
      if(!updFound||!updFound.assetUrl){ setUpdResult(updErrMsg("no_release")); return; }
      ensureUpdListeners();
      const b=$("#suUpdInstall"); setBtnLoading(b,true,t("upd_downloading"));
      const w=$("#suUpdBarWrap"); if(w) w.style.display="";
      Bridge.downloadUpdate(updFound.assetUrl);
    };
  }
  function showUpdApply(){
    const host=$("#suUpdAction"); if(!host) return;
    if(!(window.APP_INFO&&window.APP_INFO.frozen)){
      host.innerHTML=""; setUpdResult(t("upd_ready")+"\n"+t("upd_dev_hint")); return;
    }
    setUpdResult(t("upd_ready"));
    host.innerHTML=`<button class="btn btn-primary" id="suUpdApply" style="width:100%">${t("upd_apply")}</button>`;
    $("#suUpdApply").onclick=()=>modal({title:t("upd_restart_title"), body:t("upd_restart_body"), danger:true,
      onConfirm:async()=>{
        const r=await Bridge.applyUpdate();
        if(!(r&&r.ok)) setUpdResult(updErrMsg(r&&r.error));
        // ok ise uygulama kapanır; bat gerisini halleder
      }});
  }
  function ensureUpdListeners(){
    if(updListenersOn) return; updListenersOn=true;
    Bridge.on("update:progress",p=>{
      const bar=$("#suUpdBar"); if(bar&&p.pct>=0) bar.style.width=p.pct+"%";
      const b=$("#suUpdInstall"); const tx=b&&b.querySelector(".btn-txt");
      if(tx) tx.textContent=p.pct>=0?`${t("upd_downloading")} %${p.pct}`:`${t("upd_downloading")} ${p.mb} MB`;
    });
    Bridge.on("update:ready",()=>{ showUpdApply(); });
    Bridge.on("update:error",e=>{
      const b=$("#suUpdInstall"); if(b) setBtnLoading(b,false);
      setUpdResult(updErrMsg(e&&e.error));
    });
  }
  function wireUpdateCard(root){
    const ver=$("#suUpdVer",root);
    if(ver&&window.APP_INFO&&window.APP_INFO.version) ver.textContent=`${t("upd_current")}: v${window.APP_INFO.version}`;
    const auto=$("#suUpdAuto",root);
    if(auto) auto.onchange=e=>{ CONFIG.update=CONFIG.update||{auto:true};
      CONFIG.update.auto=e.target.checked; Bridge.saveConfig(CONFIG); };
    const chk=$("#suUpdCheck",root);
    if(chk) chk.onclick=async()=>{
      setBtnLoading(chk,true,t("upd_checking")); $("#suUpdAction").innerHTML="";
      try{
        const r=await Bridge.checkUpdate();
        if(!r||!r.ok) setUpdResult(updErrMsg(r&&r.error));
        else if(!r.hasUpdate) setUpdResult(t("upd_uptodate"));
        else showUpdFound(r);
      }catch(e){ setUpdResult(updErrMsg("network")); }
      finally{ setBtnLoading(chk,false); }
    };
    const zip=$("#suUpdZip",root);
    if(zip) zip.onclick=async()=>{
      const r=await Bridge.pickUpdateZip();
      if(!(r&&r.ok)) return;
      showUpdApply();
    };
    // açılış denetimi bir sonuç bulduysa kartı önceden doldur
    if(window.__updFound) showUpdFound(window.__updFound);
  }
  window.refreshUpdateCard=function(){ if(window.__updFound&&$("#suUpdRepo")) showUpdFound(window.__updFound); };

  function rebuildSetup(){
    thumbCtls.forEach(c=>c.destroy&&c.destroy()); thumbCtls=[];
    const main=$("#main");
    const old=$("#screen-setup"); if(old) old.remove();
    main.insertAdjacentHTML("beforeend", window.renderSetup());
    window.wireSetup(); window.__rerenderText();
    if(window.__refreshBrand) window.__refreshBrand();
    navigate("setup");
  }

  function refreshColorInputs(){
    const c=CONFIG.theme.colors;
    [["accent",c.accent],["accent2",c.accent2],["bg",c.bg],["surface",c.surface],["text",c.text]].forEach(([f,v])=>{
      const inp=$(`[data-col="${f}"]`); if(inp)inp.value=v;
      const hex=$(`[data-col-hex="${f}"]`); if(hex)hex.textContent=v;
    });
    const rad=$("#suRadius"); if(rad){rad.value=CONFIG.theme.radius; $("#suRadiusVal").textContent=CONFIG.theme.radius+"px";}
    const glow=$("#suGlow"); if(glow){glow.value=CONFIG.theme.glow; $("#suGlowVal").textContent=Math.round(CONFIG.theme.glow*30)+"%";}
  }

  window.refreshSetupText=function(){
    // dil değişince efekt etiketleri + tema kart mod etiketleri
    $$(".fx-card").forEach(card=>{ const k=card.dataset.fx; const lbl=card.querySelector(".fx-label");
      if(lbl&&EFFECT_LABELS[k]) lbl.textContent=EFFECT_LABELS[k][LANG]||EFFECT_LABELS[k].en; });
    $$("[data-mode-label]").forEach(sp=>{ const k=sp.dataset.modeLabel;
      if(THEME_PRESETS[k]) sp.textContent=(LANG==="tr")?(THEME_PRESETS[k].mode==="light"?"açık":"koyu"):THEME_PRESETS[k].mode; });
    // JS ile üretilen <option>'lar data-t taşımaz → dil değişince elle tazele (seçim korunur)
    const nf=$("#suNameFont"); if(nf) nf.innerHTML=fontOptions(CONFIG.jam.nameFont);
    const tf=$("#suTagFont");  if(tf) tf.innerHTML=fontOptions(CONFIG.jam.taglineFont);
    const tu=$("#suTimeup"); if(tu){ const v=CONFIG.launcher.onTimeUp;
      tu.innerHTML=`<option value="kill" ${v==="kill"?"selected":""}>${t("timeup_kill")}</option>`+
                   `<option value="warn" ${v==="warn"?"selected":""}>${t("timeup_warn")}</option>`+
                   `<option value="return" ${v==="return"?"selected":""}>${t("timeup_return")}</option>`; }
    // güncelleme sürüm çipi (etiket + dinamik sürüm) JS ile kurulur → dil değişince tazele
    const uv=$("#suUpdVer"); if(uv&&window.APP_INFO&&window.APP_INFO.version) uv.textContent=`${t("upd_current")}: v${window.APP_INFO.version}`;
  };
})();

/* ============================================================
   QR KOD ÜRETECİ — saf JS, harici kütüphane yok.
   Byte modu, hata düzeltme seviyesi M, sürüm 1–7 (≈122 bayta kadar),
   maske 0. LAN oy linkleri için telefon kamerasıyla okutma.
   ============================================================ */
function qrMatrix(text){
  const data=new TextEncoder().encode(text);
  // sürüm başına veri kod sözcüğü kapasitesi (seviye M) + blok yapısı
  const DATA_CW=[0,16,28,44,64,86,108,124];
  const EC_CW  =[0,10,16,26,18,24,16,18];   // blok başına EC
  const BLOCKS =[0,1,1,1,2,2,4,4];
  const ALIGN  ={2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38]};
  let ver=0;
  for(let v=1;v<=7;v++){ if(4+8+data.length*8 <= DATA_CW[v]*8){ ver=v; break; } }
  if(!ver) return null;

  // --- bit tamponu: mod(0100) + uzunluk(8) + veri + sonlandırıcı + dolgu ---
  const bits=[];
  const push=(val,n)=>{ for(let i=n-1;i>=0;i--) bits.push((val>>>i)&1); };
  push(4,4); push(data.length,8);
  for(const b of data) push(b,8);
  const capBits=DATA_CW[ver]*8;
  push(0, Math.min(4, capBits-bits.length));
  while(bits.length%8) bits.push(0);
  for(let pad=0xEC; bits.length<capBits; pad^=0xFD) push(pad,8); // EC↔11
  const dataCW=[];
  for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; dataCW.push(b); }

  // --- GF(256) Reed-Solomon ---
  const EXP=new Array(512), LOG=new Array(256);
  for(let i=0,x=1;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11D; }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const gmul=(a,b)=>(a&&b)?EXP[LOG[a]+LOG[b]]:0;
  const ecLen=EC_CW[ver];
  let gen=[1];
  for(let i=0;i<ecLen;i++){
    const next=new Array(gen.length+1).fill(0);
    for(let j=0;j<gen.length;j++){ next[j]^=gmul(gen[j],EXP[i]); next[j+1]^=gen[j]; }
    gen=next;
  }
  function rs(block){
    // gen[] artan kuvvet sıralı (gen[0]=sabit terim, baş katsayı hariç);
    // bölme döngüsü en yüksek kuvvetten başlar → ters indeksle erişilir
    const rem=new Array(ecLen).fill(0);
    for(const b of block){
      const factor=b^rem[0];
      rem.shift(); rem.push(0);
      if(factor!==0){
        for(let j=0;j<ecLen;j++) rem[j]^=gmul(gen[ecLen-1-j],factor);
      }
    }
    return rem;
  }

  // --- bloklara böl + EC üret + serpiştir (M'de v1-7 blokları eş boyutlu) ---
  const nb=BLOCKS[ver], k=DATA_CW[ver]/nb;
  const blocks=[], ecs=[];
  for(let i=0;i<nb;i++){ const bl=dataCW.slice(i*k,(i+1)*k); blocks.push(bl); ecs.push(rs(bl)); }
  const all=[];
  for(let i=0;i<k;i++) for(const bl of blocks) all.push(bl[i]);
  for(let i=0;i<ecLen;i++) for(const e of ecs) all.push(e[i]);

  // --- matris + fonksiyon modülleri ---
  const size=17+4*ver;
  const M=Array.from({length:size},()=>new Array(size).fill(0));
  const F=Array.from({length:size},()=>new Array(size).fill(false));
  const set=(y,x,v)=>{ M[y][x]=v?1:0; F[y][x]=true; };
  const finder=(y,x)=>{ for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
    const yy=y+dy,xx=x+dx; if(yy<0||yy>=size||xx<0||xx>=size) continue;
    const d=Math.max(Math.abs(dx),Math.abs(dy)); set(yy,xx, d!==2&&d!==4);
  }};
  finder(3,3); finder(3,size-4); finder(size-4,3);
  for(let i=8;i<size-8;i++){ if(!F[6][i]) set(6,i,i%2===0); if(!F[i][6]) set(i,6,i%2===0); }
  const ap=ALIGN[ver]||[];
  const last=ap.length-1;
  for(let ai=0;ai<ap.length;ai++) for(let aj=0;aj<ap.length;aj++){
    // yalnız üç finder köşesiyle çakışanlar atlanır (zamanlamayla çakışan çizilir)
    if((ai===0&&aj===0)||(ai===0&&aj===last)||(ai===last&&aj===0)) continue;
    const cy=ap[ai], cx=ap[aj];
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)
      set(cy+dy,cx+dx, Math.max(Math.abs(dx),Math.abs(dy))!==1);
  }
  // format bilgisi (seviye M=00, maske 0) — BCH(15,5) + maske deseni
  // yerleşim spec'e göre (x=sütun, y=satır)
  let fdata=0b00000; let frem=fdata<<10;
  for(let i=14;i>=10;i--) if((frem>>>i)&1) frem^=0x537<<(i-10);
  const fbits=((fdata<<10)|frem)^0x5412;
  const fb=i=>(fbits>>>i)&1;
  for(let i=0;i<=5;i++) set(i,8,fb(i));          // sütun 8, satır 0..5
  set(7,8,fb(6)); set(8,8,fb(7)); set(8,7,fb(8));
  for(let i=9;i<15;i++) set(8,14-i,fb(i));        // satır 8, sütun 5..0
  for(let i=0;i<8;i++) set(8,size-1-i,fb(i));     // satır 8, sağ kenar
  for(let i=8;i<15;i++) set(size-15+i,8,fb(i));   // sütun 8, alt kenar
  set(size-8,8,1); // koyu modül
  // sürüm bilgisi (v7+) — BCH(18,6)
  if(ver>=7){
    let vrem=ver<<12;
    for(let i=17;i>=12;i--) if((vrem>>>i)&1) vrem^=0x1F25<<(i-12);
    const vbits=(ver<<12)|vrem;
    for(let i=0;i<18;i++){
      const b=(vbits>>>i)&1, a=size-11+i%3, c=Math.floor(i/3);
      set(a,c,b); set(c,a,b);
    }
  }

  // --- veri yerleştirme (zigzag) + maske 0 ---
  const dbits=[];
  for(const b of all) for(let i=7;i>=0;i--) dbits.push((b>>>i)&1);
  let bi=0;
  for(let right=size-1;right>=1;right-=2){
    if(right===6) right=5;
    for(let vert=0;vert<size;vert++){
      for(let j=0;j<2;j++){
        const x=right-j;
        const upward=((right+1)&2)===0;
        const y=upward? size-1-vert : vert;
        if(F[y][x]) continue;
        let bit=bi<dbits.length?dbits[bi++]:0;
        if(((x+y)%2)===0) bit^=1; // maske 0
        M[y][x]=bit;
      }
    }
  }
  return M;
}

/* QR'ı canvas'a çiz — tarayıcılar için her zaman beyaz zemin + siyah modül
   (tema renginden bağımsız; okunabilirlik şart) */
function drawQRCanvas(canvas, text, targetPx){
  const m=qrMatrix(text);
  if(!m) return false;
  const n=m.length, quiet=4;
  const scale=Math.max(2, Math.floor((targetPx||440)/(n+quiet*2)));
  const px=(n+quiet*2)*scale;
  canvas.width=px; canvas.height=px;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,px,px);
  ctx.fillStyle="#000000";
  for(let y=0;y<n;y++) for(let x=0;x<n;x++)
    if(m[y][x]) ctx.fillRect((x+quiet)*scale,(y+quiet)*scale,scale,scale);
  return true;
}

/* 5×7 piksel bitmap'leri (satır satır, 35 bit) — Pixel stili rakamları bunlardan çizer */
const CD_PIX={
  "0":"01110"+"10001"+"10011"+"10101"+"11001"+"10001"+"01110",
  "1":"00100"+"01100"+"00100"+"00100"+"00100"+"00100"+"01110",
  "2":"01110"+"10001"+"00001"+"00010"+"00100"+"01000"+"11111",
  "3":"11111"+"00010"+"00100"+"00010"+"00001"+"10001"+"01110",
  "4":"00010"+"00110"+"01010"+"10010"+"11111"+"00010"+"00010",
  "5":"11111"+"10000"+"11110"+"00001"+"00001"+"10001"+"01110",
  "6":"00110"+"01000"+"10000"+"11110"+"10001"+"10001"+"01110",
  "7":"11111"+"00001"+"00010"+"00100"+"01000"+"01000"+"01000",
  "8":"01110"+"10001"+"10001"+"01110"+"10001"+"10001"+"01110",
  "9":"01110"+"10001"+"10001"+"01111"+"00001"+"00010"+"01100",
  ":":"00000"+"00100"+"00100"+"00000"+"00100"+"00100"+"00000",
  "-":"00000"+"00000"+"00000"+"01110"+"00000"+"00000"+"00000"
};
function cdDigitsHTML(str,style){
  if(style==="pixel")

      return `<span class="cd-d cd-px${ch===":"?" sep":""}">${[...bm].map(b=>`<i class="${b==="1"?"on":""}"></i>`).join("")}</span>`;
    }).join("");

    +`<span class="cd-cursor">&nbsp;</span>`;
}
let cdAutoFired=false;   // oturumluk: oto-geçiş bir kez; saat/arm değişince sıfırlanır
let cdLastPhase=null;
let cdObsInfo=null;      // {url, transparentUrl} — sunucu başlatılınca dolar

/* --- faz durum makinesi: her çağrıda Date.now()'dan saf hesap (drift yok) --- */
function cdComputeState(){
  const cd=CONFIG.countdown||{};
  const startMs=cd.startAt?Date.parse(cd.startAt):NaN;
  if(!cd.startAt||isNaN(startMs)) return {phase:"idle",deltaMs:0};
  const endMs=startMs+(parseFloat(cd.durationHours)||48)*3600e3;
  const now=Date.now();
  if(now<startMs) return {phase:"pre", deltaMs:startMs-now};
  if(now<endMs)   return {phase:"main", deltaMs:endMs-now};
  return {phase:"done", deltaMs:0};
}
/* parça listesi: pre'de ≥24s ise [GG,SS,DD,SN], yoksa [SS,DD,SN] (main: toplam saat, ör. 48:00:00) */
function cdParts(ms,daysSplit){
  let s=Math.max(0,Math.ceil(ms/1000));
  const sec=s%60, min=Math.floor(s/60)%60;
  if(daysSplit&&s>=86400) return [Math.floor(s/86400),Math.floor(s/3600)%24,min,sec];
  return [Math.floor(s/3600),min,sec];
}
function cdStr(ms,daysSplit){ return cdParts(ms,daysSplit).map(v=>String(v).padStart(2,"0")).join(":"); }

function cdStatusText(st){
  if(st.phase==="idle") return t("cd_status_idle");
  if(st.phase==="pre")  return t("cd_phase_pre")+" "+cdStr(st.deltaMs,true);
  if(st.phase==="main") return t("cd_phase_main")+" "+cdStr(st.deltaMs,false);
  return t("cd_status_done");
}

    <div class="cd-logos">
      ${cd.logoLeft?`<img class="cd-side" src="${cd.logoLeft}" alt="">`:"<span></span>"}
      ${center?`<img class="cd-center" src="${center}" alt="">`:`<div class="cd-center-ph">GAME JAM<br>LOGO</div>`}
      ${cd.logoRight?`<img class="cd-side r" src="${cd.logoRight}" alt="">`:"<span></span>"}
    </div>
    <div class="cd-bottom">
      <div class="cd-phase" id="cdPhase"></div>

        <div class="cd-ghost" id="cdGhost" aria-hidden="true"></div>

      <div class="cd-done-msg" id="cdDoneMsg" hidden>${t("cd_done")}</div>
    </div>
  </div>`;
  cdUpdateStage(st);
}
function cdSetDigits(str){
  const dg=$("#cdDigits"); if(!dg||dg.dataset.v===str) return;
  const lenChanged=(dg.dataset.v||"").length!==str.length;
  dg.dataset.v=str;
  dg.innerHTML=cdDigitsHTML(str, CONFIG.countdown.style);
  const gh=$("#cdGhost");
  if(gh) gh.innerHTML=[...str].map(ch=>ch===":"?`<span class="cd-sep">:</span>`:`<span class="cd-d">8</span>`).join("");
  if(lenChanged) cdFitDigits();
}
/* sayaç ekrana SIĞAR: uzun format (GG:SS:DD:SN) ve geniş stiller (Pixel) taşarsa
   font boyutu kullanılabilir genişliğe ölçeklenir */
function cdFitDigits(){
  const dg=$("#cdDigits"); if(!dg) return;
  const stage=dg.closest(".cd-stage"); if(!stage) return;
  const gh=$("#cdGhost");
  // sabit 100px tabanda ölç → genişliği DOLDURACAK boyutu oransal kur (büyüt VEYA küçült);
  // em-tabanlı hane genişlikleri → doğrusal ölçek; yükseklik tavanıyla sınırla.
  dg.style.fontSize="100px"; if(gh) gh.style.fontSize="100px";
  const w=dg.scrollWidth||1;
  const availW=stage.clientWidth*0.94;
  let px=100*availW/w;
  px=Math.min(px, stage.clientHeight*0.46);   // logolar+faz+bar için dikey pay
  px=Math.max(24, px);
  dg.style.fontSize=px+"px"; if(gh) gh.style.fontSize=px+"px";
}
window.addEventListener("resize",()=>{ if(currentScreen==="countdownstage") cdFitDigits(); });
/* HP Bar: main fazında kalan oran; pre'de dolu, done'da boş; ≤%25'te kırmızı+yanıp sönme */
function cdUpdateBar(st){
  const bar=$("#cdBar"); if(!bar) return;
  let frac = st.phase==="main"
    ? st.deltaMs/(((parseFloat(CONFIG.countdown.durationHours)||48))*3600e3)
    : st.phase==="pre" ? 1 : 0;
  frac=Math.max(0,Math.min(1,frac));
  bar.classList.toggle("low", st.phase!=="pre" && frac<=.25);
  bar.querySelector("i").style.width=(frac*100)+"%";
}
function cdUpdateStage(st){
  if(st.phase!==cdLastPhase){ renderCountdownStage(); return; }   // faz geçişi → tam render
  if(st.phase==="idle") return;
  cdUpdateBar(st);
  const ph=$("#cdPhase"), dm=$("#cdDoneMsg");
  if(st.phase==="done"){
    if(ph) ph.textContent=t("cd_phase_main");
    if(dm) dm.hidden=false;
    cdSetDigits("00:00:00");
    return;
  }
  if(dm) dm.hidden=true;
  if(ph) ph.textContent=t(st.phase==="pre"?"cd_phase_pre":"cd_phase_main");
  cdSetDigits(cdStr(st.deltaMs, st.phase==="pre"));
}

/* --- global tik: sahne güncelle + T-10dk oto tam ekran (her ekrandan) --- */
function cdTick(){

  if(currentScreen==="countdown"){ const sl=$("#cdStatusLine"); if(sl) sl.textContent=cdStatusText(st); }
  // armed iken başlamaya ≤10 dk kala bir kez sahneye geç; ESC sonrası yeniden tetiklenmez.
  // Bayrak kalıcı değil: mekan PC'si T-10 penceresinde yeniden başlarsa yine bir kez açılır.
  if(CONFIG.countdown&&CONFIG.countdown.armed&&st.phase==="pre"&&st.deltaMs<=600e3&&!cdAutoFired){
    cdAutoFired=true; navigate("countdownstage");
  }
}

/* ---- Real pywebview bridge (used when window.pywebview is present) ---- */
function makePyBridge(){
  const em = makeEmitter();
  window.JamDeck = window.JamDeck || {};
  window.JamDeck.emit = (ev, payload) => em.emit(ev, payload);

  const api = window.pywebview.api;
  return {
    on: (ev, cb) => em.on(ev, cb),
    _emit: (ev, p) => em.emit(ev, p),

    getConfig:    ()        => api.getConfig(),
    saveConfig:   (c)       => api.saveConfig(c),
    resetConfig:  ()        => api.resetConfig(),
    exportConfig: ()        => api.exportConfig(),
    importConfig: ()        => api.importConfig(),

    pickImage:         (target) => api.pickImage(target),
    selectGamesFolder: ()       => api.selectGamesFolder(),
    openGamesFolder:   ()       => api.openGamesFolder(),
    openGuide:         ()       => api.openGuide(),
    savePng:           (dataUrl, name) => api.savePng(dataUrl, name),
    startCountdownServer: ()    => api.startCountdownServer(),
    openCountdownPage:    ()    => api.openCountdownPage(),
    getAppInfo:     ()      => api.getAppInfo(),
    checkUpdate:    ()      => api.checkUpdate(),
    downloadUpdate: (url)   => api.downloadUpdate(url),
    pickUpdateZip:  ()      => api.pickUpdateZip(),
    applyUpdate:    ()      => api.applyUpdate(),
    startVoting:       ()        => api.startVoting(),
    stopVoting:        ()        => api.stopVoting(),
    startInternetVoting:()       => api.startInternetVoting(),
    getInternetVotingState:()    => api.getInternetVotingState(),
    openUrl:           (u)       => api.openUrl(u),
    stopInternetVoting: ()       => api.stopInternetVoting(),
    getVotingStatus:   ()        => api.getVotingStatus(),
    setVotingConfig:   (v)       => api.setVotingConfig(v),
    getResults:        ()        => api.getResults(),
    exportResults:     ()        => api.exportResults(),
    resetVotes:        ()        => api.resetVotes(),
    getAccessCodes:    ()        => api.getAccessCodes(),
    regenerateCodes:   (g)       => api.regenerateCodes(g),

    startDownload:  (url, key) => api.startDownload(url, key),
    cancelDownload: ()         => api.cancelDownload(),

    // wrap fire-and-forget methods in Promises that resolve on their done events
    verifyArchives: () => new Promise(resolve => {
      const off = em.on('verify:done', data => { off(); resolve(data); });
      api.verifyArchives();
    }),
    organizeFiles: () => new Promise(resolve => {
      const off = em.on('organize:done', data => { off(); resolve(data); });
      api.organizeFiles();
    }),

    scanGames:   ()                        => api.scanGames(),
    setGameInfo: (gid, name, team)         => api.setGameInfo(gid, name, team),
    launchGame:  (gid, exeIdx, mins)       => api.launchGame(gid, exeIdx, mins),
    stopGame:    ()                        => api.stopGame(),
  };
}

/* ---------- tiny DOM helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function fmtTime(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60),s=sec%60; return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
function escAttr(s){ return String(s==null?"":s).replace(/"/g,"&quot;"); }

/* ---------- TOASTS ---------- */
function toast(msg,type="success"){
  let stack=$(".toast-stack"); if(!stack){ stack=el(`<div class="toast-stack"></div>`); document.body.appendChild(stack); }
  const cls = type==="success"?"ok":type==="error"?"err":type==="warning"?"warn":"";
  const tt=el(`<div class="toast ${cls}"><span>${msg}</span></div>`);
  stack.appendChild(tt);
  setTimeout(()=>{ tt.classList.add("out"); setTimeout(()=>tt.remove(),240); },2600);
}

/* ---------- MODAL ---------- */
function modal({title,body,confirmLabel,cancelLabel,danger,onConfirm}){
  const bd=el(`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">
    <h3>${title}</h3><p>${body}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-cancel>${cancelLabel||t("cancel")}</button>
      <button class="btn ${danger?"btn-danger":"btn-primary"}" data-ok>${confirmLabel||t("confirm")}</button>
    </div></div></div>`);
  document.body.appendChild(bd);
  requestAnimationFrame(()=>bd.classList.add("show"));
  const close=()=>{ bd.classList.remove("show"); setTimeout(()=>bd.remove(),240); };
  bd.querySelector("[data-cancel]").onclick=close;
  bd.querySelector("[data-ok]").onclick=()=>{ close(); onConfirm&&onConfirm(); };
  bd.onclick=e=>{ if(e.target===bd) close(); };
}

const DL_STAGES=["download","extract","organize","ready"];
function setStage(stage){
  const idx=DL_STAGES.indexOf(stage);
  $$("#dlStages .stage").forEach((s,i)=>{
    s.classList.toggle("done", idx>i || stage==="__all__");
    s.classList.toggle("active", i===idx);
  });
}
function setDlStatus(state){
  dlState=state;
  const chip=$("#dlStatusChip"); if(!chip) return;
  const map={ idle:["chip","st_idle"], running:["chip chip-accent","st_running"],
              done:["chip chip-ok","st_done"], error:["chip chip-err","st_error"] };
  const [cls,key]=map[state]||map.idle;
  chip.className=cls;
  chip.innerHTML=`<span class="dot"></span><span data-t="${key}">${t(key)}</span>`;
}

function wireDownload(){
  const eye=$("#dlKeyEye"), key=$("#dlKey");
  eye.onclick=()=>{ const show=key.type==="password"; key.type=show?"text":"password"; eye.innerHTML=icon(show?"eyeoff":"eye"); };
  $("#dlOpenDir").onclick=()=>Bridge.openGamesFolder();

  const start=$("#dlStart"), verify=$("#dlVerify");
  function setDlRunningUI(running){
    start.classList.toggle("btn-danger",running);
    start.classList.toggle("btn-primary",!running);
    const txt=start.querySelector(".btn-txt");
    if(txt) txt.textContent=running?("✕ "+t("cancel")):t("start_download");
  }
  start.onclick=()=>{
    if(dlState==="running"){
      // çalışırken aynı buton iptale dönüşür
      Bridge.cancelDownload();
      setDlStatus("idle"); setDlRunningUI(false); setStage(null);
      $("#dlBar").classList.remove("indeterminate");
      return;
    }
    // alanları config'e kalıcı yaz (boş başlar, girilince hatırlanır)
    CONFIG.itch={ jamUrl:$("#dlUrl").value.trim(), apiKey:$("#dlKey").value.trim() };
    Bridge.saveConfig(CONFIG);
    setDlStatus("running"); setDlRunningUI(true);
    $("#homeConsole").innerHTML=""; $("#homeChips").innerHTML="";
    $("#dlBar").classList.add("indeterminate");
    setStage("download");
    Bridge.startDownload(CONFIG.itch.jamUrl, CONFIG.itch.apiKey);
  };
  verify.onclick=()=>{ $("#homeConsole").innerHTML=""; setBtnLoading(verify,true,t("working"));
    Bridge.verifyArchives().then(()=>setBtnLoading(verify,false)); };

  Bridge.on("download:progress",d=>{
    $("#dlBar").classList.remove("indeterminate");
    $("#dlCur").textContent=d.current; $("#dlTot").textContent=d.total;
    $("#dlSpeed").textContent=d.speed||"—"; $("#dlName").textContent=d.name||"—";
    $("#dlFill").style.width=(d.current/Math.max(1,d.total)*100)+"%";
  });
  Bridge.on("download:done",d=>{
    $("#dlBar").classList.remove("indeterminate");
    if(d&&d.ok===false){ setDlStatus("error"); setDlRunningUI(false); setStage(null); return; }
    // indirme bitti → açma/düzenleme otomatik zincirlenir (backend başlatır)
    setStage("extract");
    toast(t("dl_done"),"success");
  });
  Bridge.on("organize:done",sum=>{
    setStage("__all__"); setDlStatus("done"); setDlRunningUI(false);
    $("#dlFill").style.width="100%";
    if(sum){
      $("#homeChips").innerHTML=`
        <span class="chip chip-ok"><span class="dot"></span>${sum.extracted||0} ${t("sum_extracted")}</span>
        <span class="chip chip-warn"><span class="dot"></span>${sum.fixed||0} ${t("sum_fixed")}</span>
        <span class="chip chip-err"><span class="dot"></span>${sum.removed||0} ${t("sum_removed")}</span>`;
    }
    toast(t("org_done"),"success");
    gamesLoaded=false; // oyun listesi tazelensin
    if(currentScreen==="launcher") ensureGamesLoaded(); // Sunum'daysa anında yenile
  });
  Bridge.on("log",e=>{
    if(e.channel==="download"||e.channel==="verify"||e.channel==="organize") appendLog("#homeConsole",e);
    if(e.channel==="organize" && dlState==="running") setStage("organize");
  });
}

/* ---------- PNG poster (SVG -> canvas -> dataURL, offline, no libs) ---------- */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#000"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function wrapText(text,maxChars){
  const words=String(text).split(/\s+/); const lines=[]; let cur="";
  for(const w of words){
    if((cur+" "+w).trim().length>maxChars){ if(cur)lines.push(cur); cur=w; }
    else cur=(cur+" "+w).trim();
  }
  if(cur)lines.push(cur);
  return lines.length?lines:[""];
}
function buildGuidePoster(){
  const W=1080,H=1920;
  const c=key=>cssVar(COLOR_VAR_MAP[key]);
  const bg=c("bg"),bg2=c("bg2"),surf=c("surface"),border=c("border"),
        accent=c("accent"),accent2=c("accent2"),text=c("text"),muted=c("textMuted");
  const jamName=(CONFIG&&CONFIG.jam&&CONFIG.jam.name)||"Game Jam";
  const logo=CONFIG&&CONFIG.jam&&CONFIG.jam.logo;
  const nameFont=(CONFIG.jam.nameFont||"'Segoe UI',system-ui,sans-serif").replace(/"/g,"'");

  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="'Segoe UI',system-ui,sans-serif">`;
  s+=`<defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg2}"/><stop offset="1" stop-color="${bg}"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${accent}"/><stop offset="1" stop-color="${accent2}"/></linearGradient>
  </defs>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#bgg)"/><rect width="${W}" height="14" fill="url(#acc)"/>`;
  // BÜYÜK logo — kırpılmadan, en-boy oranı korunarak (diğer ekranlarla aynı dil)
  let y;
  if(logo){
    s+=`<image href="${logo}" x="140" y="80" width="800" height="320" preserveAspectRatio="xMidYMid meet"/>`;
    y=520;
  } else {
    y=230;
  }
  s+=`<text x="540" y="${y}" text-anchor="middle" font-size="58" font-weight="800" font-family="${nameFont}" fill="${text}">${esc(jamName)}</text>`;
  s+=`<text x="540" y="${y+62}" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="8" fill="${accent}">${esc(t("guide_poster_tag"))}</text>`;
  // ana mesaj — büyük ve okunaklı
  const yH=y+200;
  s+=`<text x="540" y="${yH}" text-anchor="middle" font-size="52" font-weight="800" fill="${text}">${esc(gv("poster_h_a")||t("poster_h_a"))}</text>`;
  s+=`<text x="540" y="${yH+108}" text-anchor="middle" font-size="86" font-weight="800" fill="${accent}">${esc(gv("poster_em")||t("poster_em"))}</text>`;
  s+=`<rect x="485" y="${yH+150}" width="110" height="8" rx="4" fill="url(#acc)"/>`;
  // maddeler — kullanıcı override'ları varsa onlar basılır
  const items=["poster_li1","poster_li2","poster_li3","poster_li4"].map(k=>gv(k)||t(k));
  const top=yH+230, cardH=logo?172:200, gap=logo?30:40;
  items.forEach((line,i)=>{
    const yy=top+i*(cardH+gap);
    s+=`<rect x="90" y="${yy}" width="${W-180}" height="${cardH}" rx="30" fill="${surf}" stroke="${border}" stroke-width="2"/>`;
    s+=`<rect x="90" y="${yy}" width="14" height="${cardH}" rx="7" fill="${accent}"/>`;
    s+=`<text x="165" y="${yy+cardH/2}" dominant-baseline="central" font-size="46" font-weight="700" fill="${text}">${esc(line)}</text>`;
  });
  s+=`<text x="${W/2}" y="${H-58}" text-anchor="middle" font-size="28" fill="${muted}">${esc(jamName)} · ${esc(t("guide_poster_tag"))}</text>`;
  s+=`</svg>`;
  return s;
}
function svgToPng(svgString,w,h){
  return new Promise((resolve,reject)=>{
    const url="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svgString)));
    const img=new Image();
    img.onload=()=>{ try{
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      resolve(cv.toDataURL("image/png"));
    }catch(e){ reject(e); } };
    img.onerror=()=>reject(new Error("svg render failed"));
    img.src=url;
  });
}
// Bir DOM elemanını OLDUĞU GİBİ (sayfanın kendi CSS'iyle) PNG'ye çevirir — foreignObject
// içine elemanı + tüm <style>'ları gömer. color-mix/gradient gerçek tarayıcıyla render olur;
// kapaklar dataURL olduğu için canvas tainting YOK. Kaydetme = ekrandaki görünümün aynısı.
async function domToPng(el, scale){
  scale = scale || 2;
  const w = el.clientWidth, h = el.scrollHeight;
  let css = ""; document.querySelectorAll("style").forEach(s => css += s.textContent + "\n");
  const xml = new XMLSerializer().serializeToString(el);
  const bg = cssVar("--bg") || "#050a14";
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
    + '<foreignObject x="0" y="0" width="100%" height="100%">'
    + '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px;background:' + bg + '">'
    + '<style><![CDATA[' + css + ']]></style>' + xml + '</div>'
    + '</foreignObject></svg>';
  return svgToPng(svg, w * scale, h * scale);
}
async function exportGuide(){
  const btn=$("#guideExport"); setBtnLoading(btn,true,t("guide_exporting"));
  try{
    const dataUrl=await svgToPng(buildGuidePoster(),1080,1920);
    const fname=((CONFIG.jam.name||"JamDeck").replace(/[^\w\-]+/g,"_"))+"_Kilavuz.png";

    else toast(t("guide_export_fail"),"error");
  }catch(e){ console.error(e); toast(t("guide_export_fail"),"error"); }
  finally{ setBtnLoading(btn,false); }
}

  const boardRow=burl?`<div class="link-row" style="margin-top:8px">
      <span class="who" style="color:${groupDot(k)}" title="${t("vote_board_hint")}">${t("vote_board")}</span>

  panel.innerHTML=`<div class="vg-codes-head">
      <span>${info.used||0}/${info.seats||codes.length} ${t("vote_seat_used")}</span>
      <div class="vg-codes-actions">
        <button class="btn btn-secondary btn-sm" data-grp-copy="${k}">${t("vote_copy_all")}</button>
        <button class="btn btn-secondary btn-sm" data-grp-regen="${k}">${t("vote_regen")}</button>
      </div>
    </div>
    <div class="code-chips">${chips}</div>${boardRow}`;
}

/* Katsayı alanına klavye girişi: tam sayı = doğrudan ağırlık (1→×0.01, 10→×0.10,
   100→×1.00), ondalıklı (0.8 / 0,8) = katsayının kendisi (→ ağırlık 80).
   Geçersiz girişte null döner (eski değer korunur). */
function parseCoefInput(raw,max){
  const s=String(raw).trim().replace(",",".");
  if(!s) return null;
  const f=parseFloat(s);
  if(isNaN(f)||f<0) return null;
  const w=s.includes(".")?Math.round(f*100):Math.round(f);
  return Math.max(0,Math.min(max,w));
}

let _voteState=null, _voteIp=null, _publicUrl=null, _votingRunning=false, _inetPending=false;
// link tabanı: internet (Cloudflare tüneli) açıksa public URL, değilse LAN ip:port
function voteBaseFor(st){
  if(_publicUrl) return _publicUrl;
  const port=st&&st.port;
  return (port&&_voteIp)?`http://${_voteIp}:${port}`:null;
}
function voteLinkFor(st,k){
  const gt=st&&st.group_tokens, tok=gt&&gt[k], base=voteBaseFor(st);
  if(base&&tok) return `${base}/v/${tok}`;
  return (st&&st.urls&&st.urls[k])||"";
}
function renderVoteLinks(st){
  const host=$("#voteLinks"), ipSel=$("#voteIpSel"); if(!host) return;
  if(!st||!(st.urls||st.group_tokens)){ host.innerHTML=""; if(ipSel)ipSel.style.display="none"; const si=$("#voteInetStatus"); if(si)si.style.display="none"; _voteState=null; return; }
  _voteState=st;
  // İnternet modu: public link hazır olana dek LAN linklerini GÖSTERME → loading
  // (kullanıcı kararı: internette LAN linki hiç görünmesin, flicker olmasın)
  if(_inetPending && !_publicUrl){
    if(ipSel) ipSel.style.display="none";
    host.innerHTML=`<div class="links-loading">${t("vote_internet_starting")}</div>`;
    return;
  }
  const groups=CONFIG.voting.groups;
  const ips=(st.ips&&st.ips.length)?st.ips:(st.ip?[st.ip]:[]);
  if(!_voteIp||!ips.includes(_voteIp)) _voteIp=ips[0]||st.ip;
  if(ipSel){
    if(ips.length>1){
      ipSel.style.display="";
      ipSel.innerHTML=ips.map(ip=>`<option value="${ip}" ${ip===_voteIp?"selected":""}>${ip}</option>`).join("");
      ipSel.onchange=()=>{ _voteIp=ipSel.value; renderVoteLinks(_voteState); };
    } else ipSel.style.display="none";
  }
  if(_publicUrl && ipSel) ipSel.style.display="none";   // internet modunda IP seçimi gereksiz
  const gt=st.group_tokens;
  const linkFor=k=>voteLinkFor(st,k);
  const keys=Object.keys(gt||st.urls||{}).filter(k=>!groups[k]||groups[k].enabled);
  const rows=keys.map(k=>{
    const lab=(groups[k]&&groups[k].label)||k;
    const url=linkFor(k);
    return `<div class="link-row">
      <span class="who" style="color:${groupDot(k)}">${lab}</span>
      <span class="url" data-copy="${escAttr(url)}">${url}</span>
      <button class="btn btn-secondary btn-sm copy-btn" data-copy="${escAttr(url)}" title="${t("vote_copy_all")}">${icon("copy")}</button>
      <button class="btn btn-secondary btn-sm" data-qr="${escAttr(url)}" data-lab="${escAttr(lab)}" title="${t("vote_qr")}">${icon("qr")}</button>
    </div>`;
  }).join("");
  host.innerHTML=`${rows}<div class="vl-hint">${t(_publicUrl?"vote_scan_hint_net":"vote_scan_hint")}</div>
    <div style="margin-top:10px"><button class="btn btn-secondary" id="qrStageBtn" style="width:100%">${icon("qr")} <span>${t("vote_qr_screen")}</span></button></div>`;
  const qsb=$("#qrStageBtn"); if(qsb) qsb.onclick=()=>navigate("qr");
  $$("#voteLinks [data-copy]").forEach(n=>n.onclick=()=>{
    const u=n.dataset.copy; if(!u) return;
    // SADE link kopyalanır (açıklama metni yapıştırmayı bozuyordu);
    // paylaşım için asıl yol QR kod (yandaki buton)
    if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>toast(t("vote_link_copied"),"success")).catch(()=>{});
  });
  $$("#voteLinks [data-qr]").forEach(n=>n.onclick=()=>showQrModal(n.dataset.lab||"", n.dataset.qr));
}

// Canlı panel = sadece katılım sayacı (skorlar Sonuçlandır'a kadar GİZLİ)
function renderVoteResults(r){
  const host=$("#voteResults"); if(!host) return;
  const games=(r&&r.games)||[];
  let total=0; const summed={};
  games.forEach(g=>{ Object.keys(g.groups||{}).forEach(k=>{
    const c=(g.groups[k]&&g.groups[k].count)||0; summed[k]=(summed[k]||0)+c; total+=c;
  }); });
  if(!total){ host.innerHTML=`<div class="vote-empty">${t("vote_no_results")}</div>`; return; }
  // Grup rozetleri TEKİL KİŞİ sayısını gösterir (backend "participants"): tek telefon
  // 3 ayrı oyuna oy verse bile Seyirci=1. participants yoksa (eski/mock) oy toplamına düş.
  const people=(r&&r.participants)?r.participants:summed;
  const chips=Object.keys(CONFIG.voting.groups||{}).filter(k=>(people[k]||0)>0).map(k=>{
    const lab=(CONFIG.voting.groups[k]&&CONFIG.voting.groups[k].label)||k;
    return `<span class="chip"><span class="dot" style="background:${groupDot(k)}"></span>${lab} <b>${people[k]||0}</b></span>`;
  }).join("");
  host.innerHTML=`<div class="participation">
      <div class="big-num mono">${total}<small> ${t("vote_total_votes")}</small></div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">${chips}</div>
    </div>
    <p class="part-hint">${t("vote_live_hint")}</p>`;
}

/* ---------- Sonuçlandırma: temalı poster (PNG) + teknik .xlsx ---------- */
const GROUP_COLOR_KEYS=["accent","accent2","success","warning","error"];
function groupColors(){
  return GROUP_COLOR_KEYS.map(k=>cssVar(COLOR_VAR_MAP[k]));
}
function buildResultsPoster(r){
  const W=1080,H=1920;
  const c=key=>cssVar(COLOR_VAR_MAP[key]);
  const bg=c("bg"),bg2=c("bg2"),surf=c("surface"),border=c("border"),
        accent=c("accent"),accent2=c("accent2"),ink=c("accentInk"),text=c("text"),muted=c("textMuted");
  const scale=(r&&r.scale)||10;
  const games=(r&&r.games)||[];
  const groupsCfg=CONFIG.voting.groups||{};
  const palette=groupColors();
  const gkeys=Object.keys(groupsCfg).filter(k=>groupsCfg[k].enabled!==false);
  const gcolor={}, glabel={};
  gkeys.forEach((k,i)=>{ gcolor[k]=palette[i%palette.length]; glabel[k]=groupsCfg[k].label||k; });
  const jamName=(CONFIG&&CONFIG.jam&&CONFIG.jam.name)||"Game Jam";
  const logo=CONFIG&&CONFIG.jam&&CONFIG.jam.logo;
  const initial=(jamName.trim()[0]||"J").toUpperCase();

  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="'Segoe UI',system-ui,sans-serif">`;
  s+=`<defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg2}"/><stop offset="1" stop-color="${bg}"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${accent}"/><stop offset="1" stop-color="${accent2}"/></linearGradient>
    <clipPath id="logoclip"><circle cx="116" cy="128" r="50"/></clipPath>
  </defs>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#bgg)"/><rect width="${W}" height="12" fill="url(#acc)"/>`;
  const hy=128;
  if(logo){
    s+=`<circle cx="116" cy="${hy}" r="52" fill="${surf}" stroke="url(#acc)" stroke-width="4"/>`;
    s+=`<image href="${logo}" x="66" y="${hy-50}" width="100" height="100" clip-path="url(#logoclip)" preserveAspectRatio="xMidYMid slice"/>`;
  }else{
    s+=`<circle cx="116" cy="${hy}" r="48" fill="url(#acc)"/>`;
    s+=`<text x="116" y="${hy}" text-anchor="middle" dominant-baseline="central" font-size="46" font-weight="800" fill="${ink}">${esc(initial)}</text>`;
  }
  const nameFont=(CONFIG.jam.nameFont||"'Segoe UI',system-ui,sans-serif").replace(/"/g,"'");
  s+=`<text x="194" y="${hy-12}" font-size="42" font-weight="800" font-family="${nameFont}" fill="${text}">${esc(jamName)}</text>`;
  s+=`<text x="194" y="${hy+34}" font-size="28" font-weight="700" letter-spacing="4" fill="${accent}">${esc((t("vote_results_title")||"").toUpperCase())}</text>`;
  let lx=60; const ly=232;
  gkeys.forEach(k=>{
    s+=`<rect x="${lx}" y="${ly-14}" width="20" height="20" rx="5" fill="${gcolor[k]}"/>`;
    s+=`<text x="${lx+28}" y="${ly+3}" font-size="24" fill="${muted}">${esc(glabel[k])}</text>`;
    lx+=48+glabel[k].length*14;
  });

  const top=290, gap=24, footer=90;
  if(!games.length){
    s+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="34" fill="${muted}">${esc(t("vote_no_results"))}</text>`;
    s+=`</svg>`; return s;
  }
  const avail=H-top-footer;
  const maxCards=Math.max(1,Math.floor(avail/140));
  const shown=games.slice(0,maxCards);
  const extra=games.length-shown.length;
  const n=shown.length;
  const cardH=Math.min(240,Math.floor((avail-gap*(n-1))/n));
  shown.forEach((g,i)=>{
    const y=top+i*(cardH+gap), lead=i===0;
    const col=lead?accent:border;
    s+=`<rect x="60" y="${y}" width="${W-120}" height="${cardH}" rx="26" fill="${surf}" stroke="${col}" stroke-width="${lead?3:2}"/>`;
    s+=`<circle cx="128" cy="${y+58}" r="34" fill="${lead?'url(#acc)':border}"/>`;
    s+=`<text x="128" y="${y+58}" text-anchor="middle" dominant-baseline="central" font-size="34" font-weight="800" fill="${lead?ink:text}">${i+1}</text>`;
    const nm=wrapText(g.name||g.id,26)[0];
    s+=`<text x="184" y="${y+50}" font-size="34" font-weight="800" fill="${text}">${esc(nm)}</text>`;
    s+=`<text x="${W-90}" y="${y+44}" text-anchor="end" font-size="48" font-weight="800" fill="${accent}">${(g.weighted!=null?g.weighted:0)}</text>`;
    s+=`<text x="${W-90}" y="${y+74}" text-anchor="end" font-size="22" fill="${muted}">/ ${scale} · ${g.total_votes||0} ${esc(t("vote_votes"))}</text>`;
    const withScore=gkeys.filter(k=>g.groups&&g.groups[k]&&g.groups[k].score!=null);
    const barTop=y+92, barAreaH=cardH-100;
    const rows=Math.max(1,withScore.length);
    const rowH=Math.min(40,Math.floor(barAreaH/rows));
    const barX=300, barW=W-300-220;
    withScore.forEach((k,ri)=>{
      const yy=barTop+ri*rowH+rowH/2;
      const sc=g.groups[k].score, cnt=g.groups[k].count||0;
      const w=Math.max(6,Math.round((sc/scale)*barW));
      s+=`<text x="184" y="${yy}" dominant-baseline="central" font-size="22" font-weight="700" fill="${gcolor[k]}">${esc(glabel[k])}</text>`;
      s+=`<rect x="${barX}" y="${yy-9}" width="${barW}" height="18" rx="9" fill="${bg}"/>`;
      s+=`<rect x="${barX}" y="${yy-9}" width="${w}" height="18" rx="9" fill="${gcolor[k]}"/>`;
      s+=`<text x="${barX+barW+12}" y="${yy}" dominant-baseline="central" font-size="24" font-weight="800" fill="${text}">${sc}<tspan font-size="18" fill="${muted}"> · ${cnt}</tspan></text>`;
    });
  });
  let foot=`${esc(jamName)} · ${esc(t("vote_results_title"))}`;
  if(extra>0) foot+=`  ·  +${extra}`;
  s+=`<text x="${W/2}" y="${H-44}" text-anchor="middle" font-size="24" fill="${muted}">${foot}</text>`;
  s+=`</svg>`;
  return s;
}

function setInetStatus(txt){ const s=$("#voteInetStatus"); if(s){ s.removeAttribute("data-t"); s.textContent=txt; s.style.display=txt?"":"none"; } }
function resetInternet(){
  _publicUrl=null; _inetPending=false;
  const s=$("#voteInetStatus"); if(s){ s.removeAttribute("data-t"); s.textContent=""; s.style.display="none"; }
}
// İnternet modunda Başlat'ta funnel'ı açar (ayrı aç/kapa anahtarı YOK — üstteki
// mod seçimi belirler). Durdurmada stopVoting funnel'ı da kapatır.
async function startInternetTunnel(){
  setInetStatus(t("vote_internet_starting"));
  let res; try{ res=await Bridge.startInternetVoting(); }catch(e){ res=null; }
  if(!res||!res.ok){ resetInternet(); renderVoteLinks(_voteState); toast((res&&res.error)||t("vote_internet_fail"),"error"); return; }
  if(res.already&&res.url){ _publicUrl=res.url; _inetPending=false; setInetStatus(t("vote_internet_on")); renderVoteLinks(_voteState); }
  else if(res.downloading) setInetStatus(t("vote_internet_dl"));
  // gerisini tunnel:ready / tunnel:error olayları halleder
}
// ===== OYLAMA = ONLINE (tek yol; eski İnternet/LAN seçimi kaldırıldı) =====
// Oylama her zaman internet üzerinden (Tailscale Funnel) servis edilir; sabit
// bağlantı, ~500 kişiye kadar stabil. LAN modu + kapasite testi tamamen kaldırıldı.
function applyVotingStatus(st){
  const running=!!(st&&st.running);
  _votingRunning=running;
  renderVoteGroups();   // kapasite/erişim alanlarını çalışırken kilitle / dururken aç
  updateVoteToggle(running);
  if(!running) resetInternet();
  renderVoteLinks(running?st:null);
  if(currentScreen==="qr") renderQrStage(); // sunucu durumu değişirse sahne tazelensin
  // Finalize her zaman görünür: sunucu kapalıyken bile eski oylar (votes.json) açılabilsin.
  const fb=$("#voteFinalize"); if(fb){ fb.style.display=""; }
  if(running) startVotePolling();
  // Sunucu kapalı: polling yok ama eski oyları BİR KEZ göster (yoksa boş mesaj düşer).
  else { stopVotePolling(); fetchVoteResults(); }
}

async function toggleVoting(){
  const st=await Bridge.getVotingStatus();
  if(st&&st.running){ await Bridge.stopVoting(); applyVotingStatus({running:false}); toast(t("vote_stopped"),"info"); }
  else{
    const b=$("#voteToggle"); b.disabled=true;
    // voter sayfası EKRANDA GÖRÜNEN temayla açılsın: kaydedilmemiş tema
    // değişiklikleri de sunucu başlamadan diske yazılır
    await Bridge.saveConfig(CONFIG);
    const res=await Bridge.startVoting(); b.disabled=false;
    if(res&&res.ok){
      _inetPending=true;   // public link hazır olana dek loading göster
      applyVotingStatus({...res,running:true}); toast(t("vote_running"),"success");
      // Online oylama: tüneli Başlat'ta her zaman aç (public link). LAN firewall yok.
      startInternetTunnel();
    }
    else toast((res&&res.error)||t("vote_start_fail"),"error");
  }
}

function wireVoting(){
  if(!$("#screen-voting")) return;
  if(!CONFIG.voting) CONFIG.voting=JSON.parse(JSON.stringify(DEFAULT_CONFIG.voting));
  if(!CONFIG.voting.categories) CONFIG.voting.categories=JSON.parse(JSON.stringify(DEFAULT_CONFIG.voting.categories));
  const port=$("#votePort"); if(port) port.value=CONFIG.voting.port;
  renderVoteGroups();
  renderVoteCategories();
  updateVoteToggle(false);
  const groupsHost=$("#voteGroups");
  if(groupsHost){
    groupsHost.oninput=e=>{
      const d=e.target.dataset;
      if(d.grpEn){ CONFIG.voting.groups[d.grpEn].enabled=e.target.checked; $(`.group-row[data-grp="${d.grpEn}"]`)?.classList.toggle("off",!e.target.checked); }
      if(d.grpW){ CONFIG.voting.groups[d.grpW].weight=+e.target.value; const ci=$(`[data-grp-win="${d.grpW}"]`); if(ci) ci.value=(e.target.value/100).toFixed(2); }
      if(d.grpPin){ CONFIG.voting.groups[d.grpPin].pin=e.target.value; }
      if(d.grpLimit){ CONFIG.voting.groups[d.grpLimit].limit=Math.max(0,parseInt(e.target.value)||0); }
      if(d.grpCount){ CONFIG.voting.groups[d.grpCount].codeCount=Math.max(0,parseInt(e.target.value)||0); }
      persistVoting();
    };
    groupsHost.onclick=async e=>{
      const seg=e.target.closest("[data-grp-access]");
      if(seg){
        const b=e.target.closest("button"); if(!b||!b.dataset.val) return;
        const k=seg.dataset.grpAccess, g=CONFIG.voting.groups[k];
        if(g.access===b.dataset.val) return;
        g.access=b.dataset.val;
        if(g.access==="codes" && (!g.codeCount||g.codeCount<1)) g.codeCount=(g.limit>0?g.limit:10);
        _codesOpen[k]=false;
        renderVoteGroups(); persistVoting(); return;
      }
      const cb=e.target.closest("[data-grp-codesbtn]"); if(cb){ toggleCodesPanel(cb.dataset.grpCodesbtn); return; }
      const bc=e.target.closest("[data-board-copy]"); if(bc){
        if(navigator.clipboard) navigator.clipboard.writeText(bc.dataset.boardCopy)

/* kalan dereceye göre arka plan efektini yoğunlaştır (1.'ye doğru artar) */
function cerSetFx(rank){
  const fx=CEREMONY.fx, total=CEREMONY.depth; if(!fx) return;
  if(rank==null){ fx.setEffect("fireflies",26,.6); return; }
  if(rank>3){ const k=(total-rank+1)/total; fx.setEffect("orbs", Math.round(16+k*26), .5+k*.55); }
  else if(rank===3){ fx.setEffect("confetti",70,.9); }
  else if(rank===2){ fx.setEffect("confetti",120,1.15); }
  else { fx.setEffect("confetti",230,1.45); }   // 1.
}

                    : `<div class="cer-cover ph">🎮</div>`;

/* kenar konfeti topu — sağ ve sol kenardan içeri/yukarı doğru patlatır (her açılışta) */
function cerBurstSize(){
  const b=cerBurst; if(!b) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  b.w=b.canvas.clientWidth; b.h=b.canvas.clientHeight;
  b.canvas.width=Math.round(b.w*dpr); b.canvas.height=Math.round(b.h*dpr);
  b.ctx.setTransform(dpr,0,0,dpr,0,0);
}
function cerBurstLoop(){
  const b=cerBurst; if(!b){ return; }
  b.ctx.clearRect(0,0,b.w,b.h);
  for(let i=b.parts.length-1;i>=0;i--){ const p=b.parts[i];
    p.vy+=0.28; p.vx*=0.992; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
    const a=p.life>p.max?Math.max(0,1-(p.life-p.max)/28):1;
    if(a<=0||p.y>b.h+24){ b.parts.splice(i,1); continue; }
    b.ctx.save(); b.ctx.translate(p.x,p.y); b.ctx.rotate(p.rot); b.ctx.globalAlpha=a;
    b.ctx.fillStyle=p.col; b.ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); b.ctx.restore();
  }
  b.ctx.globalAlpha=1;
  b.raf = b.parts.length ? requestAnimationFrame(cerBurstLoop) : null;
}
function cerFireSides(power){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("#cerBurst"); if(!cv) return;
  if(!cerBurst) cerBurst={canvas:cv, ctx:cv.getContext("2d"), parts:[], raf:null, w:0, h:0};
  const b=cerBurst; cerBurstSize();
  const c=themeColors(); const pal=[c.accent,c.accent2,c.text,"#ffd700","#ff3d7f"];
  const n=Math.round(34*power);
  const launch=(fromLeft)=>{
    for(let i=0;i<n;i++){
      const ang=rnd(0.32,1.18);                 // yataydan yukarı doğru açı
      const sp=rnd(8,16)*(0.85+power*0.28);
      b.parts.push({
        x:fromLeft?-6:b.w+6, y:b.h*rnd(.5,.92),
        vx:(fromLeft?1:-1)*Math.cos(ang)*sp, vy:-Math.sin(ang)*sp,
        s:rnd(6,13), rot:rnd(0,6.28), vr:rnd(-.34,.34),
        col:pal[Math.floor(Math.random()*pal.length)], life:0, max:rnd(55,110)
      });
    }
  };
  launch(true); launch(false);
  if(!b.raf) cerBurstLoop();
}
function cerBurstStop(){
  if(!cerBurst) return;
  if(cerBurst.raf) cancelAnimationFrame(cerBurst.raf);
  if(cerBurst.ctx&&cerBurst.w>0) cerBurst.ctx.clearRect(0,0,cerBurst.w,cerBurst.h);
  cerBurst=null;
}
function cerRender(animate){
  const stage=$("#cerStage"); if(!stage) return;
  const C=CEREMONY, total=C.depth, scale=(LAST_RESULTS&&LAST_RESULTS.scale)||10;
  const showAll=$("#cerShowAll"), count=$("#cerCount"), prev=$("#cerPrev");
  // intro (henüz açılış yok)
  if(C.pos===0){
    const logo=CONFIG.jam.logo;
    const logoPart=logo?`<img src="${logo}" alt="">`:"";
    stage.innerHTML=`<div class="cer-intro">${logoPart}<h1>${t("cer_intro_title")}</h1><div class="hint">${t("cer_intro_hint")}</div></div>`;
    if(animate) cerSetFx(null);
    if(count) count.textContent=`0 / ${total}`;
    if(prev) prev.style.visibility="hidden";
    if(showAll) showAll.hidden=true;
    return;
  }
  const rank=C.order[C.pos-1];
  const g=C.list[rank-1]||{}, meta=gameMeta(g.id);
  const cls=rank===1?"r-gold cer-anim-gold":rank===2?"r-silver cer-anim-silver":rank===3?"r-bronze cer-anim-bronze":((total-rank)%2?"cer-anim-flip":"cer-anim-up");
  const badge=(rank<=3)
    ? `<span class="cer-medal">${MEDALS[rank-1]||""}</span>`
    : `<span class="cer-rank">${rank}<small>.</small></span>`;
  // sağ mini liste: bu açılış HARİÇ açıklananlar (artan sırada)
  const revealed=C.order.slice(0,C.pos).filter(rk=>rk!==rank).sort((a,b)=>a-b);
  const miniHTML=revealed.length?`<div class="cer-mini">${revealed.map(rk=>{
    const gg=C.list[rk-1]||{};
    return `<div class="cm-row"><span class="cm-rk">${rk}</span><span class="cm-name">${gg.name||gg.id||""}</span><span class="cm-sc">${gg.weighted!=null?gg.weighted:0}</span></div>`;
  }).join("")}</div>`:"";
  stage.innerHTML=`<div class="cer-reveal ${cls}">
      <div class="cer-badge">${badge}</div>
      ${cerCover(meta)}
      <span class="cer-team">${meta.team||""}</span>
      <span class="cer-name">${g.name||g.id||""}</span>
      <span class="cer-score">${g.weighted!=null?g.weighted:0}<small>/${scale}</small></span>
    </div>${miniHTML}`;
  if(animate){
    cerSetFx(rank);
    // her yeni oyunda sağ+sol kenardan konfeti patlaması (1.'ye doğru güçlenir)
    cerFireSides(rank===1?2.6:rank===2?1.9:rank===3?1.5:1);
    if(rank===1){ const fl=$("#cerFlash"); if(fl){ fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); } }
  }
  if(count) count.textContent=`${total-rank+1} / ${total}`;
  if(prev) prev.style.visibility="visible";
  if(showAll){
    showAll.hidden=(C.pos<total);
    if(C.pos>=total) showAll.innerHTML=`📊 ${t("cer_show_all")}`;
  }
}
function cerNext(){
  const C=CEREMONY;
  if(C.lock) return;
  if(C.pos>=C.depth){ cerForceAll=true; navigate("results"); return; }   // son dereceden sonra → tüm sıralama
  C.lock=true; C.pos++; cerRender(true);
  setTimeout(()=>{ C.lock=false; }, 420);
}
function cerBack(){
  const C=CEREMONY;
  if(C.lock || C.pos<=0) return;
  C.pos--; cerRender(false);
  cerSetFx(C.pos===0?null:C.order[C.pos-1]);   // efekt yoğunluğunu geri al
}
function wireCeremony(){
  const ex=$("#cerExit"); if(ex) ex.onclick=exitCeremony;
  const sa=$("#cerShowAll"); if(sa) sa.onclick=()=>{ cerForceAll=true; navigate("results"); };
  const pv=$("#cerPrev"); if(pv) pv.onclick=e=>{ e.stopPropagation(); cerBack(); };
  const stg=$("#cerStage"); if(stg) stg.onclick=cerNext;
}

/* ============================================================
   ROUTER
   ============================================================ */
let currentScreen="download";
function navigate(id){
  if(currentScreen==="ceremony" && id!=="ceremony") stopCeremony();   // tören efektini/raf'ı temizle
  currentScreen=id;
  if(id!=="voting") stopVotePolling();
  $$(".screen").forEach(s=>s.classList.remove("active"));
  $("#screen-"+id)?.classList.add("active");
  $$(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.nav===id));
  // Sunum + QR + Sayaç + Sonuç sahnesi + Tören = tam ekran kiosk: sidebar gizli, çıkış ✕ veya ESC
  document.body.classList.toggle("kiosk-mode", id==="launcher"||id==="qr"||id==="countdownstage"||id==="resultstage"||id==="ceremony");
  if(id==="launcher"){ ensureGamesLoaded(); }
  if(id!=="setup" && window.unmountSetup) window.unmountSetup(); // efekt önizlemeleri boşa dönmesin
  if(id==="setup" && window.mountSetup) window.mountSetup();
  if(id==="countdown") renderCountdownSetup();
  if(id==="countdownstage") renderCountdownStage();
  if(id==="guide") renderGuide();
  if(id==="voting") renderVoting();
  if(id==="results") mountResults();
  if(id==="resultstage") renderResults("#resStageFull");
  if(id==="ceremony") startCeremony();
  if(id==="qr") renderQrStage();
  const m=$("#main"); if(m) m.scrollTop=0;
}

let gamesLoaded=false;
async function ensureGamesLoaded(){
  if(gamesLoaded) return;
  GAMES = await Bridge.scanGames();
  gamesLoaded=true;
  if(GAMES.length && !GAMES.find(x=>x.id===selectedGameId)) selectedGameId=GAMES[0].id;
  renderGameRows($("#llSearch")?.value||""); renderHero();
}

/* ============================================================
   CONSOLE LOG RENDERING
   ============================================================ */
function appendLog(container,{level,line}){
  const c=$(container); if(!c) return;
  const cls = level==="success"?"ln-ok":level==="warning"?"ln-warn":level==="error"?"ln-err":"";
  const tagged=String(line).replace(/(\[[A-Z]+\])/g,'<span class="log-tag">$1</span>');
  const ln=el(`<div class="ln ${cls}"><span class="t">${nowTime()}</span>${tagged}</div>`);
  c.appendChild(ln);
  c.scrollTop=c.scrollHeight;
}

function setBtnLoading(btn,on,txt){
  if(!btn) return; btn.classList.toggle("loading",on);
  const t2=btn.querySelector(".btn-txt"); if(t2&&txt&&on){ btn.dataset.orig=t2.textContent; t2.textContent=txt; }
  else if(t2&&btn.dataset.orig&&!on){ t2.textContent=btn.dataset.orig; }
}

/* ============================================================
   TEXT RE-RENDER (language switch)
   ============================================================ */
window.__rerenderText=function(){
  localizeVoteDefaults();   // dil değişince varsayılan kategori/grup etiketlerini de güncelle
  $$("[data-t]").forEach(n=>{ if(n.dataset.t==="guide_main") return; n.textContent=t(n.dataset.t); });
  $$("[data-t-text='jamname']").forEach(n=>n.textContent=CONFIG.jam.name);
  $$("[data-t-text='jamtag']").forEach(n=>n.textContent=CONFIG.jam.tagline||"");
  const s=$("#llSearch"); if(s)s.placeholder=t("search_games");
  $$("#sideLang, #suLang").forEach(sel=>{ if(sel)sel.value=LANG; });
  if(currentScreen==="launcher"){ renderHero(); renderGameRows($("#llSearch")?.value||""); }
  if(currentScreen==="setup"&&window.refreshSetupText) window.refreshSetupText();
  if(currentScreen==="guide") renderGuide();
  if(currentScreen==="voting") renderVoting();
  if(currentScreen==="results"){ if($("#resStage .res-gate")) showResultsGate(); else renderResults(); }   // kapı açıkken sonuç sızdırma
  if(currentScreen==="resultstage") renderResults("#resStageFull");
  if(currentScreen==="ceremony"){ const pv=$("#cerPrev"); if(pv) pv.textContent=t("cer_prev"); const ex=$("#cerExit"); if(ex) ex.title=t("cer_exit"); cerRender(false); }
  if(currentScreen==="countdown") renderCountdownSetup();
  if(currentScreen==="countdownstage") renderCountdownStage();
};

/* ============================================================
   EFFECT APPLY (from config)
   ============================================================ */
function applyEffectFromConfig(){
  if(!effectCtl) return;
  const e=CONFIG.effect;
  effectCtl.setEffect(e.name, e.intensity, 1);
  effectCtl.setEnabled(e.enabled);
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  // Detect pywebview: wait up to 800 ms for it to inject its API
  const inPywebview = await new Promise(resolve => {
    if(window.pywebview && window.pywebview.api) return resolve(true);
    const timer = setTimeout(() => resolve(!!(window.pywebview && window.pywebview.api)), 800);
    window.addEventListener('pywebviewready', () => {
      clearTimeout(timer);
      resolve(!!(window.pywebview && window.pywebview.api));
    }, {once: true});
  });
  Bridge = inPywebview ? makePyBridge() : makeBridge();

  CONFIG = await Bridge.getConfig();
  const firstRun = !!CONFIG.__firstRun; delete CONFIG.__firstRun;
  if(!CONFIG.itch) CONFIG.itch={jamUrl:"",apiKey:""};
  if(!CONFIG.guide) CONFIG.guide={};
  if(!CONFIG.countdown) CONFIG.countdown={armed:false,startAt:"",durationHours:48,style:"neon",logoLeft:null,logoCenter:null,logoRight:null};
  if(!CONFIG.update) CONFIG.update={auto:true};
  LANG = CONFIG.jam.language || "tr";
  document.documentElement.setAttribute("lang",LANG);
  if(CONFIG.voting) localizeVoteDefaults();   // varsayılan kategori/grup etiketlerini dile çevir
  applyConfig(CONFIG);

  // build shell
  const app=$("#app");
  app.insertAdjacentHTML("afterbegin", renderSidebar());
  const main=el(`<div class="main" id="main"></div>`);
  main.innerHTML = screenDownload()+screenLauncher()+screenCountdown()+screenCountdownStage()+screenVoting()+screenResults()+screenResultStage()+screenCeremony()+screenGuide()+screenQr()+ (window.renderSetup?window.renderSetup():"");
  app.appendChild(main);

  // effects
  effectCtl = makeEffectController($("#bg-canvas"));
  applyEffectFromConfig();

  // wire
  wireDownload(); wireLauncher(); wireTimerEvents(); wireGuide(); wireResults(); wireCeremony(); wireQrStage(); wireCountdown();
  if(window.wireSetup) window.wireSetup();

  // nav
  $$("[data-nav]").forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
  { const sl=$("#sideLang"); if(sl) sl.onchange=e=>{ setLanguage(e.target.value); CONFIG.jam.language=LANG; Bridge.saveConfig(CONFIG); }; }

  // ESC: tam ekran Sunum/QR sahnesinden çık (✕ ile aynı)
  document.addEventListener("keydown", e=>{
    if(e.key!=="Escape") return;
    if(currentScreen==="launcher") navigate("download");
    else if(currentScreen==="qr") navigate("voting");
    else if(currentScreen==="countdownstage") navigate("countdown");
    else if(currentScreen==="resultstage") navigate("results");
    else if(currentScreen==="ceremony") exitCeremony();
  });
  // Tören sahnesi klavye kontrolü: ESC çıkış (ayrı), ←/Backspace/PageUp geri, DİĞER HER TUŞ ileri
  document.addEventListener("keydown", e=>{
    if(currentScreen!=="ceremony") return;
    if(e.key==="Escape") return;   // çıkış üstteki handler'da
    if(e.key==="ArrowLeft"||e.key==="Backspace"||e.key==="PageUp"){ e.preventDefault(); cerBack(); return; }
    if(e.ctrlKey||e.altKey||e.metaKey) return;   // kısayolları bozma
    e.preventDefault(); cerNext();
  });

  // sayaç tiki: sahne güncellemesi + T-10dk oto tam ekran kontrolü
  setInterval(cdTick,1000);

  // uygulama her zaman Kurulum ekranıyla açılır (kullanıcı kararı)
  navigate("setup");

  // sürüm bilgisi (tek kaynak: backend/version.py) + sidebar
  try{
    window.APP_INFO=await Bridge.getAppInfo();
    const sv=$("#sideVersion");
    if(sv&&window.APP_INFO.version) sv.textContent="JAMDECK v"+window.APP_INFO.version;
    const uv=$("#suUpdVer");
    if(uv&&window.APP_INFO.version) uv.textContent=`${t("upd_current")}: v${window.APP_INFO.version}`;
  }catch(e){ window.APP_INFO={version:"",frozen:false}; }

  // açılışta sessiz güncelleme denetimi (yalnız gerçek uygulama + auto açık);
  // repo uygulamaya gömülü (backend/version.py UPDATE_REPO); her hata sessizce yutulur
  if(inPywebview && CONFIG.update.auto){
    setTimeout(async()=>{
      try{
        const r=await Bridge.checkUpdate();
        if(r&&r.hasUpdate){
          window.__updFound=r;
          toast(`${t("upd_toast_found")} (${r.latest})`,"info");
          if(window.refreshUpdateCard) window.refreshUpdateCard();
        }
      }catch(e){}
    },2500);
  }
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
