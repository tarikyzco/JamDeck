<!DOCTYPE html>
<html lang="tr" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JamDeck — Game Jam Launcher</title>
<!--
  JamDeck — universal, themeable game-jam launcher & manager.
  Single self-contained file · vanilla JS · zero network deps · pywebview-ready.
  Sections: THEME · STRINGS · EFFECTS · BRIDGE(mock) · SCREENS · APP/ROUTER
  Real backend: each Bridge method -> window.pywebview.api.<method>(...) ;
  Python pushes events via window.JamDeck.emit(event, payload).
-->
<style>
/* ============================================================
   JamDeck V2 — Base CSS (Faz 5 yeniden tasarım)
   Her renk var(--…) üzerinden gelir; sabit hex YOK (tema preset
   verisi JS'teki THEME_PRESETS sözlüğünde yaşar).
   --accent-ink: accent dolgu üstündeki metin rengi.
   --glow-a (0–60%): parıltı şiddeti; --glow bundan türetilir.
   ============================================================ */

/* ─────────────────────────── TEMA DEĞİŞKENLERİ ─────────────────────────── */
:root{
  /* Frostbite (varsayılan koyu tema) */
  --bg:#050a14; --bg-2:#080e1c;
  --surface:#0f1629; --surface-2:#141d33; --border:#1e293b;
  --accent:#00f2ff; --accent-2:#0062ff; --accent-ink:#03121c;
  --text:#ffffff; --text-muted:#94a3b8;
  --success:#00e676; --warning:#ffab00; --error:#ff1744;
  --radius:18px; --radius-sm:10px;
  --glow-a:30%;
  --glow:0 0 22px color-mix(in srgb, var(--accent) var(--glow-a), transparent);
  --shadow:0 6px 24px color-mix(in srgb, var(--bg) 55%, transparent);
  --font-display:system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  /* oy grupları (sonuç çubukları) */
  --g-jury:var(--accent); --g-aud:var(--accent-2); --g-team:var(--success);
  /* marka yazı boyutları + fontları (Kurulum'dan ayarlanır) */
  --name-size:14px; --tag-size:11px;
  --name-font:var(--font-display); --tag-font:var(--font-body);
}
:root[data-mode="light"]{
  --shadow:0 6px 20px color-mix(in srgb, var(--text) 10%, transparent);
}

/* ─────────────────────────────── TABAN ─────────────────────────────── */
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 var(--font-body); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::selection{background:color-mix(in srgb, var(--accent) 30%, transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-2); border-radius:8px; border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
h1,h2,h3{font-family:var(--font-display)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)}

/* ───────────────────────────── APP KABUĞU ───────────────────────────── */
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.bg-veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 80% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%),
    radial-gradient(700px 500px at -10% 100%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 70%);
}
#app{position:relative;z-index:2;height:100vh;display:flex}

/* ────────────────────────────── SIDEBAR ────────────────────────────── */
.sidebar{
  position:relative; width:240px; flex:0 0 240px; height:100%;
  display:flex; flex-direction:column; gap:4px; padding:18px 14px 14px;
  background:color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--border); z-index:30;
}
.brand{display:flex; flex-direction:column; gap:10px; padding:4px 6px 16px}
.logo-ph{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:1.5px dashed color-mix(in srgb, var(--text-muted) 45%, transparent);
  border-radius:var(--radius-sm); padding:14px 8px;
  font-family:var(--font-display); font-weight:800; letter-spacing:.14em;
  color:var(--text-muted); text-align:center; line-height:1.15; font-size:17px;
}
.brand-logo-img{width:100%;max-height:220px;object-fit:contain;display:block}
.brand .jam-name{
  text-align:center; font-family:var(--name-font); font-weight:700;
  font-size:var(--name-size); letter-spacing:.06em; color:var(--text);
}
.brand .jam-tag{
  text-align:center; font-family:var(--tag-font); font-size:var(--tag-size); color:var(--text-muted);
  letter-spacing:.16em; text-transform:uppercase;
}
.nav{display:flex; flex-direction:column; gap:3px; flex:1}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px;
  border-radius:var(--radius-sm); border:1px solid transparent;
  color:var(--text-muted); font-weight:600; font-size:13.5px;
  cursor:pointer; user-select:none; background:none; width:100%; text-align:left;
  font-family:var(--font-body); transition:background .16s, color .16s, border-color .16s;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px}
.nav-item:hover{background:color-mix(in srgb, var(--text) 5%, transparent); color:var(--text)}
.nav-item.active{
  background:color-mix(in srgb, var(--accent) 12%, transparent);
  border-color:color-mix(in srgb, var(--accent) 28%, transparent);
  color:var(--accent);
}
.nav-sep{flex:1}
.sidebar-foot{display:flex; flex-direction:column; gap:10px; padding-top:10px; border-top:1px solid var(--border)}
.sidebar-foot .row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 4px}
.version{font:10.5px var(--font-mono); color:var(--text-muted); text-align:center; letter-spacing:.06em}

/* ─────────────────────────────── MAIN ─────────────────────────────── */
.main{position:relative; z-index:1; flex:1; min-width:0; height:100vh; overflow-y:auto}
.screen{display:none; padding:26px 28px 40px; max-width:1380px; margin:0 auto}
.screen.active{display:block; animation:screenIn .22s ease}
@keyframes screenIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.page-head h1{font-size:24px; font-weight:800; letter-spacing:-.01em}
.page-head p{color:var(--text-muted); font-size:13px; margin-top:3px}
.page-head .head-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* ─────────────────────────────── KART ─────────────────────────────── */
.card{
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:blur(10px);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.card.featured{
  border-color:color-mix(in srgb, var(--accent) 35%, var(--border));
  box-shadow:var(--glow), var(--shadow);
}
.card-head{display:flex; align-items:center; gap:9px; margin-bottom:13px}
.card-head svg{width:15px;height:15px;color:var(--accent);flex:0 0 15px}
.card-title{font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text)}
.card-head .spacer{flex:1}

/* ────────────────────────────── BUTONLAR ────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:8px 15px; border-radius:var(--radius-sm); border:1px solid transparent;
  font:600 13px var(--font-body); color:var(--text); cursor:pointer; user-select:none;
  background:transparent; white-space:nowrap;
  transition:transform .15s, box-shadow .2s, background .16s, border-color .16s, opacity .16s, filter .16s;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn-primary{
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent-2) 80%, var(--accent)));
  color:var(--accent-ink); box-shadow:var(--glow); font-weight:700;
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--surface-2); border-color:var(--border)}
.btn-secondary:hover{border-color:color-mix(in srgb, var(--accent) 40%, var(--border)); color:var(--accent)}
.btn-danger{background:color-mix(in srgb, var(--error) 14%, transparent); border-color:color-mix(in srgb, var(--error) 40%, transparent); color:var(--error)}
.btn-danger:hover{background:color-mix(in srgb, var(--error) 24%, transparent)}
.btn-ghost{color:var(--text-muted)}
.btn-ghost:hover{background:color-mix(in srgb, var(--text) 6%, transparent); color:var(--text)}
.btn-lg{padding:12px 22px; font-size:14.5px; border-radius:calc(var(--radius-sm) + 3px)}
.btn-lg svg{width:19px;height:19px}
.btn-sm{padding:5px 10px; font-size:12px}
.btn-sm svg{width:14px;height:14px}
.btn[disabled],.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; pointer-events:none}
.btn.loading{pointer-events:none}
.btn.loading .btn-spinner{display:inline-block}
.btn-spinner{display:none;width:14px;height:14px;flex:0 0 14px;border-radius:50%;
  border:2px solid color-mix(in srgb,currentColor 30%,transparent);
  border-top-color:currentColor;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.links-loading{display:flex;align-items:center;gap:10px;padding:16px 4px;color:var(--text-muted);font-size:12.5px}
.links-loading::before{content:"";width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--text-muted) 30%,transparent);border-top-color:var(--accent);animation:spin .7s linear infinite}
.btn-dashed{border:1.5px dashed var(--border); color:var(--text-muted); width:100%; justify-content:center}
.btn-dashed:hover{border-color:var(--accent); color:var(--accent)}

/* ───────────────────────────── ÇİP / ROZET ───────────────────────────── */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px;
  border-radius:999px; font:600 11.5px var(--font-body);
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
}
.chip svg{width:13px;height:13px}
.chip .dot{width:7px; height:7px; border-radius:50%; background:var(--text-muted); flex:0 0 7px}
.chip-accent{background:color-mix(in srgb, var(--accent) 13%, transparent); border-color:color-mix(in srgb, var(--accent) 35%, transparent); color:var(--accent)}
.chip-accent .dot{background:var(--accent)}
.chip-ok{background:color-mix(in srgb, var(--success) 13%, transparent); border-color:color-mix(in srgb, var(--success) 35%, transparent); color:var(--success)}
.chip-ok .dot{background:var(--success)}
.chip-warn{background:color-mix(in srgb, var(--warning) 13%, transparent); border-color:color-mix(in srgb, var(--warning) 35%, transparent); color:var(--warning)}
.chip-warn .dot{background:var(--warning)}
.chip-err{background:color-mix(in srgb, var(--error) 13%, transparent); border-color:color-mix(in srgb, var(--error) 35%, transparent); color:var(--error)}
.chip-err .dot{background:var(--error)}
.chip .mono{font-size:11px}

/* ───────────────────────────── FORM ÖĞELERİ ───────────────────────────── */
.field{display:flex; flex-direction:column; gap:5px}
.field>label,.field-label{font:600 11.5px var(--font-body); letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted)}
.input,.select{
  width:100%; padding:9px 12px; border-radius:var(--radius-sm);
  background:color-mix(in srgb, var(--bg-2) 80%, transparent);
  border:1px solid var(--border); color:var(--text);
  font:13.5px var(--font-body); transition:border-color .16s, box-shadow .16s;
}
.input::placeholder{color:color-mix(in srgb, var(--text-muted) 65%, transparent)}
/* number input'un tarayıcı varsayılanı mini ok butonları tasarıma uymuyor — her yerde gizli
   (yazma + klavye yukarı/aşağı okları aynen çalışır) */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
input[type=number]{-moz-appearance:textfield; appearance:textfield}
.input:focus,.select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}
.input.mono{font-family:var(--font-mono); font-size:12.5px}
.select{appearance:none; cursor:pointer;
  background-image:linear-gradient(45deg, transparent 49%, var(--text-muted) 50%),linear-gradient(-45deg, transparent 49%, var(--text-muted) 50%);
  background-size:5px 5px; background-position:calc(100% - 17px) 55%, calc(100% - 12px) 55%; background-repeat:no-repeat; padding-right:32px;
}
.select option{background:var(--surface);color:var(--text)}
/* dil seçici — kompakt, otomatik genişlik */
.select-lang{width:auto; min-width:130px; padding-top:7px; padding-bottom:7px; font-size:13px; font-weight:600}
.side-lang{flex:1; min-width:0; font-size:12.5px; padding-top:6px; padding-bottom:6px}
.input-wrap{position:relative; display:flex; align-items:center}
.input-wrap .input{padding-right:38px}
.input-eye{
  position:absolute; right:6px; background:none; border:none; cursor:pointer;
  color:var(--text-muted); font-size:15px; padding:4px 6px; border-radius:6px;
}
.input-eye svg{width:16px;height:16px;display:block}
.input-eye:hover{color:var(--accent)}
/* slider */
input[type=range]{appearance:none; -webkit-appearance:none; width:100%; height:18px; background:transparent; cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px; border-radius:4px; background:var(--surface-2); border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; border-radius:50%; margin-top:-6px;
  background:var(--accent); border:2px solid color-mix(in srgb, var(--accent-ink) 60%, var(--accent));
  box-shadow:0 0 8px color-mix(in srgb, var(--accent) 50%, transparent);
}
input[type=range]::-moz-range-track{height:5px; border-radius:4px; background:var(--surface-2); border:1px solid var(--border)}
input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:var(--accent); border:none}
/* switch */
.sw{appearance:none; -webkit-appearance:none; width:36px; height:20px; flex:0 0 36px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); position:relative; cursor:pointer; transition:background .18s, border-color .18s}
.sw::before{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--text-muted); transition:transform .18s, background .18s}
.sw:checked{background:color-mix(in srgb, var(--accent) 30%, var(--surface-2)); border-color:var(--accent)}
.sw:checked::before{transform:translateX(16px); background:var(--accent)}
.sw:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
/* checkbox */
.cb{appearance:none; -webkit-appearance:none; width:17px; height:17px; flex:0 0 17px; border-radius:5px; border:1.5px solid var(--border); background:var(--bg-2); cursor:pointer; display:inline-grid; place-content:center; transition:background .15s, border-color .15s}
.cb::before{content:"✓"; font-size:11px; font-weight:900; color:var(--accent-ink); transform:scale(0); transition:transform .15s}
.cb:checked{background:var(--accent); border-color:var(--accent)}
.cb:checked::before{transform:scale(1)}
/* renk seçici */
.colorpick{display:flex; align-items:center; gap:9px}
.colorpick input[type=color]{
  appearance:none; -webkit-appearance:none; width:34px; height:34px; flex:0 0 34px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:none; cursor:pointer; padding:2px;
}
.colorpick input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.colorpick input[type=color]::-webkit-color-swatch{border:none; border-radius:6px}
.colorpick .cp-meta{display:flex; flex-direction:column; gap:1px}
.colorpick .cp-name{font-size:12px; font-weight:700}
.colorpick .cp-val{font:10.5px var(--font-mono); color:var(--text-muted)}

/* ──────────────────────────── SEGMENT / SEKME ──────────────────────────── */
.seg{display:inline-flex; gap:3px; padding:3px; background:color-mix(in srgb, var(--bg-2) 80%, transparent); border:1px solid var(--border); border-radius:calc(var(--radius-sm) + 3px)}
.seg button{
  border:none; background:transparent; color:var(--text-muted); cursor:pointer;
  padding:6px 14px; border-radius:var(--radius-sm); font:600 12.5px var(--font-body);
  transition:background .15s, color .15s;
}
.seg button:hover{color:var(--text)}
.seg button.active{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent)}
.seg.seg-sm button{padding:4px 10px; font-size:11.5px}

/* ──────────────────────────── İLERLEME / KONSOL ──────────────────────────── */
.progress{height:9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; position:relative}
.progress .fill{
  height:100%; border-radius:999px; width:0;
  background:linear-gradient(90deg, var(--accent-2), var(--accent));
  box-shadow:0 0 12px color-mix(in srgb, var(--accent) var(--glow-a), transparent);
  transition:width .3s ease;
}
.progress.indeterminate .fill{width:35%; animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{margin-left:-35%}100%{margin-left:100%}}
.console{
  background:color-mix(in srgb, var(--bg-2) 92%, transparent);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  font:12px/1.7 var(--font-mono); padding:12px 14px; height:170px; overflow-y:auto;
}
.console .ln{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-muted); animation:logIn .2s ease}
@keyframes logIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
.console .ln .t{opacity:.5; margin-right:10px}
.console .ln .log-tag{color:var(--accent);font-weight:600}
.console .ln-ok{color:var(--success)}
.console .ln-warn{color:var(--warning)}
.console .ln-err{color:var(--error)}

/* ─────────────────────────── EKRAN 1 · ANA ─────────────────────────── */
.home-grid{display:grid; grid-template-columns:minmax(330px,1.05fr) 1.6fr; gap:14px; align-items:start}
.home-grid .col{display:flex; flex-direction:column; gap:14px; min-width:0}
.form-stack{display:flex; flex-direction:column; gap:13px}
.btn-row{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.stat-strip{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.big-num{font:800 40px/1 var(--font-mono); letter-spacing:-.03em}
.big-num small{font-size:19px; color:var(--text-muted); font-weight:600}
.now-playing{font:12px var(--font-mono); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.now-playing b{color:var(--text); font-weight:600}
.stages{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:12px}
.stage{
  display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
  font:600 11.5px var(--font-body); color:var(--text-muted);
  background:var(--surface-2); border:1px solid var(--border);
}
.stage .dot{width:7px; height:7px; border-radius:50%; background:var(--text-muted)}
.stage.done{color:var(--success); border-color:color-mix(in srgb, var(--success) 35%, transparent)}
.stage.done .dot{background:var(--success)}
.stage.active{
  color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent);
  border-color:color-mix(in srgb, var(--accent) 40%, transparent); box-shadow:var(--glow);
}
.stage.active .dot{background:var(--accent); animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.35}}
.stage-arrow{color:color-mix(in srgb, var(--text-muted) 50%, transparent); font-size:11px}
.summary-chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.path-chip{display:flex; align-items:center; gap:8px; max-width:340px}
.path-chip .mono{font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#homeConsole{height:240px}

/* ─────────────────────── EKRAN 2 · SUNUM — gerçek tam ekran sahne ─────────────────────── */
body.kiosk-mode .sidebar{display:none}
#screen-launcher{max-width:none; padding:0; height:100vh; overflow:hidden}
#screen-launcher.active{display:flex; flex-direction:column}
/* sadece BÜYÜK logo — isim/slogan yok; hero sütununun üstünde durur,
   sol oyun listesi tam boy kalır (logo listeyi aşağı itmez) */
.present-brand{
  display:flex; align-items:center; justify-content:center;
  padding:26px 40px 6px; flex:0 0 auto;
}
.present-brand img{
  max-height:180px; max-width:min(640px,70%); object-fit:contain; display:block;
  filter:drop-shadow(0 10px 32px color-mix(in srgb, var(--bg) 75%, transparent));
}
.present-brand .logo-ph{padding:26px 44px; font-size:30px; letter-spacing:.18em; line-height:1.15}
.kiosk-exit{
  position:fixed; top:14px; right:16px; z-index:40;
  width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
  background:color-mix(in srgb, var(--surface) 45%, transparent);
  border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  color:var(--text-muted); font-size:16px; line-height:1; cursor:pointer;
  opacity:.55; transition:opacity .18s, color .18s, transform .25s;
}
.kiosk-exit:hover{opacity:1; color:var(--error); transform:rotate(90deg)}
.present-stage{flex:1; min-height:0; display:grid; grid-template-columns:minmax(280px,330px) 1fr}
.present-list{
  display:flex; flex-direction:column; gap:10px; min-height:0;
  padding:16px 14px 18px 22px;
  background:color-mix(in srgb, var(--surface) 55%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-right:1px solid color-mix(in srgb, var(--border) 80%, transparent);
}
.present-main{display:flex; flex-direction:column; min-height:0; min-width:0}
.search-row{display:flex; gap:8px; align-items:center}
.search-row .input{flex:1}
.game-rows{display:flex; flex-direction:column; gap:4px; overflow-y:auto; flex:1; min-height:0; padding-right:4px}
.present-hero{flex:1; display:grid; place-items:center; min-height:0; padding:10px 60px 46px; overflow:hidden}
.game-row{
  display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:var(--radius-sm);
  border:1px solid transparent; cursor:pointer; transition:background .14s, border-color .14s; min-width:0;
  width:100%; text-align:left;
}
.game-row:hover{background:color-mix(in srgb, var(--text) 5%, transparent)}
.game-row.selected{background:color-mix(in srgb, var(--accent) 11%, transparent); border-color:color-mix(in srgb, var(--accent) 32%, transparent)}
.game-row .thumb{
  width:46px; height:35px; flex:0 0 46px; border-radius:6px; border:1px solid var(--border);
  background-color:var(--surface-2); background-size:cover; background-position:center;
  display:grid; place-items:center; font-family:var(--font-display); font-weight:800;
  color:var(--accent); font-size:14px;
}
.game-row .meta{display:flex; flex-direction:column; min-width:0}
.game-row .team{font:600 9.5px var(--font-body); letter-spacing:.09em; text-transform:uppercase; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.game-row .team.broken{color:var(--error)}
.game-row .name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hero{
  width:min(1080px,100%);
  display:grid; grid-template-columns:minmax(320px,480px) 1fr; gap:46px; align-items:center;
  animation:heroIn .45s cubic-bezier(.2,.8,.2,1);
}
@keyframes heroIn{from{opacity:0; transform:translateY(16px) scale(.985)}}
.hero .empty-state{grid-column:1/-1; justify-content:center}
.hero-art{
  aspect-ratio:4/3; border-radius:var(--radius); overflow:hidden; position:relative;
  border:1px solid color-mix(in srgb, var(--accent) 25%, var(--border)); background:var(--bg-2);
  box-shadow:var(--glow), 0 24px 60px color-mix(in srgb, var(--bg) 70%, transparent);
}
.hero-art .blur-fill{
  position:absolute; inset:-12%;
  background-size:cover; background-position:center;
  filter:blur(22px) brightness(.55) saturate(1.2);
}
.hero-art .art-img{
  position:absolute; inset:0;
  background-size:contain; background-position:center; background-repeat:no-repeat;
}
.hero-info{display:flex; flex-direction:column; gap:14px; min-width:0}
.hero-info .team{font:700 13px var(--font-body); letter-spacing:.22em; text-transform:uppercase; color:var(--text-muted)}
.hero-info h2{font-size:clamp(34px,3.6vw,56px); font-weight:800; letter-spacing:-.02em; line-height:1.05}
.hero-chips{display:flex; gap:8px; flex-wrap:wrap}
.hero-actions{margin-top:12px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
#heroPlay{min-width:230px; font-size:16.5px; padding:14px 28px; letter-spacing:.04em}
#heroPlay svg{width:21px;height:21px}
.duration-box{display:flex; align-items:center; gap:7px; margin-left:auto}
.duration-box .input{width:62px; text-align:center; font-family:var(--font-mono)}
.duration-box label{font:600 11px var(--font-body); color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em}
.empty-state{display:flex; flex-direction:column; align-items:center; gap:10px; padding:60px 20px; color:var(--text-muted); text-align:center}
.empty-state svg{width:40px;height:40px;opacity:.5}
.empty-state .es-title{font-size:15px;font-weight:600;color:var(--text)}
.empty-state[hidden]{display:none}

/* ─────────────────────────── EKRAN 3 · OYLAMA ─────────────────────────── */
.vote-grid{display:grid; grid-template-columns:1.25fr 1fr; gap:14px; align-items:start}
.vote-grid .col{display:flex; flex-direction:column; gap:14px; min-width:0}
.cat-row{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid color-mix(in srgb, var(--border) 60%, transparent)}
.cat-row:last-of-type{border-bottom:none}
.cat-row.off{opacity:.5}
.cat-row .input{flex:1; padding:6px 10px; font-size:13px}
.cat-row input[type=range]{width:110px; flex:0 0 110px}
.cat-row .coef{font:600 11.5px var(--font-mono); color:var(--accent); width:52px; text-align:right; flex:0 0 52px}
/* katsayı elle de yazılabilir: tam sayı=ağırlık (1=×0.01, 100=×1.00), ondalık=katsayı */
.coef-in{width:36px; background:transparent; border:none; padding:0 0 1px;
  border-bottom:1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  color:var(--accent); font:600 11.5px var(--font-mono); text-align:left}
.coef-in:focus{outline:none; border-bottom:1px solid var(--accent)}
.coef-in:disabled{opacity:.5; border-bottom-color:transparent}
.coef{display:inline-flex; align-items:center; justify-content:flex-end; gap:1px}
.cat-row .btn-sm{flex:0 0 auto}
.group-row{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; padding:10px 0; border-bottom:1px solid color-mix(in srgb, var(--border) 60%, transparent)}
.group-row:last-of-type{border-bottom:none; padding-bottom:2px}
.group-row.off .g-controls{opacity:.45; pointer-events:none}
.vg-lock-note{font-size:11.5px; color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-radius:var(--radius-sm); padding:6px 10px; margin-bottom:8px; line-height:1.4}
.group-row .seg button:disabled,.group-row .g-extra input:disabled{opacity:.5; cursor:not-allowed}
.group-row .g-head{display:flex; align-items:center; gap:9px; grid-column:1/-1}
.group-row .g-name{font-weight:800; font-size:13px; display:flex; align-items:center; gap:7px}
.group-row .g-name .dot{width:8px; height:8px; border-radius:50%}
.group-row .g-controls{grid-column:1/-1; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.group-row input[type=range]{width:100px; flex:0 0 100px}
.group-row .coef{font:600 11.5px var(--font-mono); color:var(--accent)}
.group-row .g-extra{display:flex; align-items:center; gap:7px}
.group-row .g-extra .input{width:84px; padding:5px 9px; font-size:12px}
.group-row .g-extra .input.vg-pin{width:110px; letter-spacing:.05em}
.vg-codes-panel{grid-column:1/-1}
.vg-codes-panel.open{padding-top:8px}
.vg-codes-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:11.5px; color:var(--text-muted); flex-wrap:wrap}
.vg-codes-actions{display:flex; gap:6px}
.code-chips{display:flex; flex-wrap:wrap; gap:6px}
.code-chip{
  font-family:var(--font-mono); font-size:13px; font-weight:700; letter-spacing:.12em;
  padding:5px 9px; border-radius:7px; background:var(--surface-2);
  border:1px solid var(--border); color:var(--accent);
  cursor:pointer; transition:border-color .15s, transform .12s;
}
.code-chip:hover{border-color:color-mix(in srgb, var(--accent) 50%, var(--border))}
.code-chip:active{transform:scale(.95)}
.code-chip.used{color:var(--text-muted); border-style:dashed; opacity:.6; text-decoration:line-through}
.vg-codes-hint{font-size:11.5px; color:var(--text-muted); font-style:italic}
.server-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.server-row .input{width:84px}
.link-row{display:flex; align-items:center; gap:8px; padding:5px 0}
.link-row .who{font:700 10.5px var(--font-body); text-transform:uppercase; letter-spacing:.07em; width:54px; flex:0 0 54px}
.link-row .url{flex:1; min-width:0; font:11.5px var(--font-mono); color:var(--text-muted); background:color-mix(in srgb, var(--bg-2) 80%, transparent); border:1px solid var(--border); border-radius:7px; padding:5px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer}
.vl-hint{font-size:11.5px; color:var(--text-muted); margin-top:6px}
.participation{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.participation .big-num{font-size:34px}
.part-hint{margin-top:10px; font-size:11.5px; color:var(--text-muted)}
.vote-empty{color:var(--text-muted); font-size:13px; text-align:center; padding:18px 0}
.vote-actions{display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap}
/* şu an sunulan oyun rozeti */
.vote-current{margin-bottom:12px}
.vote-current:empty{display:none}
.vote-current.active{display:flex; align-items:center; gap:10px; padding:10px 13px; border-radius:var(--radius-sm); background:color-mix(in srgb, var(--accent) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent) 40%, transparent)}
.vote-current.waiting{padding:10px 13px; border-radius:var(--radius-sm); background:color-mix(in srgb, var(--surface-2) 50%, transparent); border:1px dashed var(--border); color:var(--text-muted); font-size:12.5px}
.vc-pulse{width:10px; height:10px; border-radius:50%; background:var(--success); flex-shrink:0; animation:vcpulse 1.6s infinite}
@keyframes vcpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--success) 55%, transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.vc-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted)}
.vc-name{font-weight:800; color:var(--accent); font-size:14px; margin-left:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ─────────────────────────── EKRAN 4 · SONUÇLAR ─────────────────────────── */
.stage-card{
  position:relative; overflow:hidden; padding:28px 30px 26px;
  background:
    radial-gradient(700px 320px at 50% -15%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    color-mix(in srgb, var(--surface) 88%, transparent);
}
/* başlıkta SADECE büyük jam logosu — isim yok (Sunum ile tutarlı) */
.stage-head{display:flex; align-items:center; justify-content:center; margin-bottom:22px}
.stage-head img{
  max-height:150px; max-width:min(480px,60%); object-fit:contain; display:block;
  filter:drop-shadow(0 10px 32px color-mix(in srgb, var(--bg) 75%, transparent));
}
.stage-head .logo-ph{padding:20px 36px; font-size:24px; letter-spacing:.16em; line-height:1.15}
.podium{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; align-items:end; max-width:880px; margin:0 auto}
.pod{
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  background:color-mix(in srgb, var(--surface-2) 80%, transparent);
  border:1px solid var(--border); border-radius:var(--radius); padding:18px 16px 16px;
}
.pod .medal{font-size:26px; line-height:1}
.pod .p-cover{
  width:100%; aspect-ratio:16/9; border-radius:9px; border:1px solid var(--border);
  background-color:var(--bg-2); background-size:contain; background-position:center;
  background-repeat:no-repeat;   /* kapak TAM görünsün, kesilmesin */
}
.pod .p-team{font:700 10px var(--font-body); letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted)}
.pod .p-name{font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:-.01em; line-height:1.15}
.score-badge{
  font:800 15px var(--font-mono); padding:4px 13px; border-radius:999px;
  background:color-mix(in srgb, var(--accent) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 40%, transparent); color:var(--accent);
}
.score-badge small{font-size:10px; opacity:.7; font-weight:600}
.pod.first{
  order:2; padding-top:24px; padding-bottom:34px;
  border-color:color-mix(in srgb, var(--accent) 45%, var(--border));
  box-shadow:var(--glow);
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%), color-mix(in srgb, var(--surface-2) 85%, transparent);
}
.pod.first .medal{font-size:34px}
.pod.first .p-name{font-size:21px}
.pod.first .score-badge{font-size:18px; box-shadow:var(--glow)}
.pod.second{order:1}
.pod.third{order:3}
.gbars{display:flex; flex-direction:column; gap:4px; width:100%}
.gbar{display:grid; grid-template-columns:14px 1fr 32px; align-items:center; gap:7px}
.gbar .gl{font:800 10px var(--font-mono); color:var(--gc,var(--text-muted))}
.gbar .track{height:6px; border-radius:99px; background:color-mix(in srgb, var(--bg-2) 85%, transparent); border:1px solid color-mix(in srgb, var(--border) 80%, transparent); overflow:hidden}
.gbar .fill{height:100%; border-radius:99px; background:var(--gc,var(--accent)); display:block}
.gbar .gv{font:700 10.5px var(--font-mono); color:var(--text-muted); text-align:right}
.legend{display:flex; gap:14px; justify-content:center; margin-top:20px}
.legend span{display:inline-flex; align-items:center; gap:6px; font:600 11px var(--font-body); color:var(--text-muted)}
.legend i{width:9px; height:9px; border-radius:3px; display:inline-block}
.rank-list{display:flex; flex-direction:column; gap:8px; max-width:880px; margin:0 auto}
.rank-row{
  display:grid; grid-template-columns:40px 1fr minmax(220px,300px) 70px; align-items:center; gap:14px;
  background:color-mix(in srgb, var(--surface-2) 80%, transparent);
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 14px;
}
.rank-row .rk{font:800 17px var(--font-mono); color:var(--text-muted); text-align:center}
.rank-row:first-child .rk{color:var(--accent)}
.rank-row .r-meta{min-width:0}
.rank-row .r-name{font-weight:800; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rank-row .r-team{font:600 10px var(--font-body); letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted)}
.rank-row .score-badge{justify-self:end; font-size:13px}
.rank-list[hidden],.podium-wrap[hidden]{display:none}
.results-empty{padding:60px 20px}

/* ─────────────── SONUÇ SPOILER KAPISI (tümünü / adım adım) ─────────────── */
.res-gate{display:flex; flex-direction:column; align-items:center; gap:22px; padding:30px 20px 46px; text-align:center}
.res-gate .rg-head{display:flex; flex-direction:column; align-items:center; gap:6px}
.res-gate h2{font-size:24px; font-weight:800; letter-spacing:-.01em}
.res-gate .rg-sub{color:var(--text-muted); font-size:13.5px}
.rg-choices{display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:680px}
.rg-card{
  display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; text-align:center;
  padding:28px 20px; border-radius:var(--radius); border:1px solid var(--border);
  background:color-mix(in srgb, var(--surface-2) 80%, transparent);
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.rg-card:hover{transform:translateY(-3px); border-color:color-mix(in srgb, var(--accent) 50%, var(--border)); box-shadow:var(--glow)}
.rg-card .rg-ic{font-size:36px; line-height:1}
.rg-card b{font-size:16px; font-family:var(--font-display)}
.rg-card span{font-size:12px; color:var(--text-muted); line-height:1.4}
.rg-card.active{border-color:color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow:var(--glow); background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 9%,transparent), transparent 60%), color-mix(in srgb,var(--surface-2) 85%,transparent)}
.rg-depth{display:flex; flex-direction:column; gap:14px; align-items:center; width:100%; max-width:520px; animation:fadeUp .35s ease both}
.rg-depth[hidden]{display:none}
.rg-custom{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text-muted)}
.rg-custom[hidden]{display:none}
.rg-custom input{width:90px; text-align:center; padding:9px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text); font:700 16px var(--font-mono)}

/* ─────────────────────── ÖDÜL TÖRENİ (sinematik sahne) ─────────────────────── */
#screen-ceremony{max-width:none; padding:0; height:100vh; overflow:hidden; position:relative; background:var(--bg)}
#screen-ceremony.active{display:block}
#cerFx{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
#cerBurst{position:absolute; inset:0; width:100%; height:100%; z-index:4; pointer-events:none}
.cer-flash{position:absolute; inset:0; z-index:3; background:#fff; opacity:0; pointer-events:none}
.cer-flash.go{animation:cerFlash .7s ease-out}
.cer-wrap{position:relative; z-index:1; width:100%; height:100%; display:flex; flex-direction:column}
.cer-stage{flex:1; display:flex; align-items:center; justify-content:center; padding:34px; position:relative; overflow:hidden; cursor:pointer}
.cer-intro{display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; animation:cerSlideUp .55s ease both}
.cer-intro img{max-height:150px; max-width:min(440px,56vw); object-fit:contain; filter:drop-shadow(0 12px 36px color-mix(in srgb,var(--bg) 75%,transparent))}
.cer-intro h1{font-size:clamp(34px,6.5vw,72px); font-weight:900; letter-spacing:.05em; line-height:1;
  background:linear-gradient(90deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.cer-intro .hint{color:var(--text-muted); font-size:15px; animation:cerHintPulse 2s ease-in-out infinite}
/* merkez açıklama kartı */
.cer-reveal{display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; max-width:min(760px,84vw)}
.cer-reveal .cer-badge{display:flex; align-items:center; justify-content:center; gap:14px}
.cer-reveal .cer-medal{font-size:clamp(46px,9vw,104px); line-height:1; filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--bg) 70%,transparent))}
.cer-reveal .cer-rank{font:900 clamp(54px,11vw,140px)/.85 var(--font-mono); letter-spacing:-.04em; color:var(--accent)}
.cer-reveal .cer-rank small{font-size:.42em; opacity:.7; font-weight:800}
.cer-reveal .cer-cover{
  width:min(460px,68vw); aspect-ratio:16/9; border-radius:16px; border:1px solid var(--border);
  background:var(--bg-2) center/contain no-repeat;
  box-shadow:0 22px 70px color-mix(in srgb,var(--bg) 82%,transparent); position:relative; overflow:hidden;
}
.cer-reveal .cer-cover.ph{display:flex; align-items:center; justify-content:center; font-size:46px; opacity:.4}
.cer-reveal .cer-team{font:700 13px var(--font-body); letter-spacing:.18em; text-transform:uppercase; color:var(--text-muted)}
.cer-reveal .cer-name{font-family:var(--font-display); font-weight:900; font-size:clamp(28px,5.4vw,58px); line-height:1.04; letter-spacing:-.01em}
.cer-reveal .cer-score{font:800 clamp(18px,2.6vw,26px) var(--font-mono); padding:7px 22px; border-radius:999px;
  background:color-mix(in srgb,var(--accent) 16%,transparent); border:1px solid color-mix(in srgb,var(--accent) 42%,transparent); color:var(--accent)}
.cer-reveal .cer-score small{font-size:.62em; opacity:.7}
/* açıklanmış dereceler — sağ kenar mini liste */
.cer-mini{position:absolute; right:28px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:7px; width:min(290px,25vw); max-height:88vh; overflow:hidden}
.cer-mini[hidden]{display:none}
.cer-mini .cm-row{display:grid; grid-template-columns:36px 1fr auto; align-items:center; gap:10px; padding:8px 12px;
  border-radius:var(--radius-sm); background:color-mix(in srgb,var(--surface-2) 78%,transparent); border:1px solid var(--border); animation:cerMiniIn .4s ease both}
.cer-mini .cm-rk{font:800 16px var(--font-mono); color:var(--text-muted); text-align:center}
.cer-mini .cm-name{font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cer-mini .cm-sc{font:700 12px var(--font-mono); color:var(--accent)}
/* alt kontrol çubuğu */
.cer-controls{display:flex; align-items:center; justify-content:center; gap:16px; padding:18px; z-index:2}
.cer-count{font:700 14px var(--font-mono); color:var(--text-muted); min-width:64px; text-align:center}
#cerShowAll{font-size:16px; padding:13px 32px}
#cerShowAll[hidden]{display:none}
/* bronz/gümüş/altın vurgu renkleri */
.cer-reveal.r-bronze .cer-rank,.cer-reveal.r-bronze .cer-score{color:#cd7f32; border-color:color-mix(in srgb,#cd7f32 50%,transparent); background:color-mix(in srgb,#cd7f32 16%,transparent)}
.cer-reveal.r-silver .cer-rank,.cer-reveal.r-silver .cer-score{color:#c0c8d4; border-color:color-mix(in srgb,#c0c8d4 50%,transparent); background:color-mix(in srgb,#c0c8d4 14%,transparent)}
.cer-reveal.r-gold .cer-name{background:linear-gradient(90deg,#ffd700,#ffae00,#fff1a8,#ffd700); -webkit-background-clip:text; background-clip:text; color:transparent; animation:cerGoldShimmer 3s linear infinite; background-size:220% auto}
.cer-reveal.r-gold .cer-score{color:#1a1300; background:linear-gradient(90deg,#ffd700,#ffae00); border-color:#ffd700; box-shadow:0 0 26px color-mix(in srgb,#ffd700 55%,transparent)}
.cer-reveal.r-gold .cer-cover{box-shadow:0 0 0 3px #ffd700, 0 26px 90px color-mix(in srgb,#ffd700 35%,transparent); animation:cerGlowPulse 2.4s ease-in-out infinite}
.cer-reveal.r-gold{transform:scale(1.04)}
/* dereceye göre giriş animasyonları (1.'ye doğru yoğunlaşır) */
.cer-anim-up{animation:cerSlideUp .55s cubic-bezier(.2,.8,.2,1) both}
.cer-anim-flip{animation:cerFlip .6s cubic-bezier(.2,.8,.2,1) both}
.cer-anim-bronze{animation:cerBronze .7s cubic-bezier(.18,.9,.25,1.1) both}
.cer-anim-silver{animation:cerSilver .8s cubic-bezier(.18,.9,.25,1.05) both}
.cer-anim-gold{animation:cerGold 1.05s cubic-bezier(.16,.85,.2,1.05) both}
/* gümüşte kapak üzerinde ışık süpürmesi */
.cer-anim-silver .cer-cover::after,.cer-anim-gold .cer-cover::after{
  content:""; position:absolute; top:0; bottom:0; width:55%;
  background:linear-gradient(100deg,transparent,color-mix(in srgb,#fff 75%,transparent),transparent);
  transform:translateX(-150%); animation:cerSweep 1.1s .35s ease-out}
@keyframes cerSlideUp{from{opacity:0; transform:translateY(46px)} to{opacity:1; transform:none}}
@keyframes cerMiniIn{from{opacity:0; transform:translateX(34px)} to{opacity:1; transform:none}}
@keyframes cerFlip{from{opacity:0; transform:perspective(1000px) rotateX(82deg)} to{opacity:1; transform:perspective(1000px) rotateX(0)}}
@keyframes cerBronze{0%{opacity:0; transform:scale(.5) rotate(-7deg)} 55%{opacity:1; transform:scale(1.1) rotate(2deg)} 100%{transform:scale(1) rotate(0)}}
@keyframes cerSilver{0%{opacity:0; transform:scale(.45)} 45%{opacity:1} 62%{transform:scale(1.12)} 78%{transform:scale(.97)} 100%{transform:scale(1)}}
@keyframes cerGold{0%{opacity:0; transform:scale(.2)} 45%{opacity:1} 66%{transform:scale(1.22)} 82%{transform:scale(.99)} 100%{transform:scale(1.04)}}
@keyframes cerFlash{0%{opacity:0} 10%{opacity:.92} 100%{opacity:0}}
@keyframes cerGlowPulse{0%,100%{box-shadow:0 0 0 3px #ffd700, 0 26px 90px color-mix(in srgb,#ffd700 22%,transparent)} 50%{box-shadow:0 0 0 3px #ffe55c, 0 26px 120px color-mix(in srgb,#ffd700 55%,transparent)}}
@keyframes cerSweep{from{transform:translateX(-150%)} to{transform:translateX(260%)}}
@keyframes cerGoldShimmer{to{background-position:220% center}}
@keyframes cerHintPulse{0%,100%{opacity:.5} 50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .cer-anim-up,.cer-anim-flip,.cer-anim-bronze,.cer-anim-silver,.cer-anim-gold{animation-duration:.25s}
  .cer-anim-silver .cer-cover::after,.cer-anim-gold .cer-cover::after,.cer-reveal.r-gold .cer-name,.cer-reveal.r-gold .cer-cover{animation:none}
  .cer-intro .hint{animation:none}
}

/* ─────────────────────────── EKRAN 5 · KILAVUZ ─────────────────────────── */
.guide-grid{display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start}
.guide-hero h2{font-size:25px; font-weight:800; letter-spacing:-.015em; line-height:1.25; margin-bottom:6px}
.guide-hero h2 em{font-style:normal; color:var(--accent)}
.guide-hero>p{color:var(--text-muted); font-size:13px; margin-bottom:16px}
.build-tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.build-tile{
  display:flex; flex-direction:column; gap:6px; padding:16px;
  border-radius:calc(var(--radius) - 4px); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  background:color-mix(in srgb, var(--accent) 6%, transparent);
}
.build-tile .ic{font-size:24px}
.build-tile b{font-size:15px; font-family:var(--font-display)}
.build-tile span{font-size:12px; color:var(--text-muted)}
.guide-tips{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px}
.tip{display:flex; flex-direction:column; gap:6px; padding:13px 14px}
.tip .ic{font-size:18px}
.tip b{font-size:12.5px}
.tip span{font-size:11.5px; color:var(--text-muted); line-height:1.45}
.poster-col{display:flex; flex-direction:column; gap:10px; align-items:stretch}
.poster{
  aspect-ratio:9/16; border-radius:calc(var(--radius) - 4px); border:1px solid var(--border);
  background:
    radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
    linear-gradient(var(--bg-2), var(--bg));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:22px; text-align:center;
}
.poster .p-logo{
  width:54px; height:54px; border-radius:12px; border:1.5px dashed color-mix(in srgb, var(--text-muted) 45%, transparent);
  display:grid; place-items:center; font:800 8px var(--font-display); color:var(--text-muted); line-height:1.2; letter-spacing:.08em;
  overflow:hidden;
}
.poster .p-logo img{width:100%;height:100%;object-fit:contain}
.poster .p-logo-img{max-height:84px;max-width:78%;object-fit:contain}
.poster h3{font-size:20px; font-weight:800; line-height:1.2; letter-spacing:-.01em}
.poster h3 em{font-style:normal; color:var(--accent)}
.poster .p-rule{width:44px; height:3px; border-radius:2px; background:linear-gradient(90deg, var(--accent), var(--accent-2))}
.poster ul{list-style:none; display:flex; flex-direction:column; gap:7px; font-size:11px; color:var(--text-muted)}
.poster .p-foot{font:9.5px var(--font-mono); color:var(--text-muted); letter-spacing:.1em; margin-top:4px}
.poster-note{font:10.5px var(--font-mono); color:var(--text-muted); text-align:center}

/* ─────────────────────────── EKRAN 6 · KURULUM ─────────────────────────── */
.setup-stack{display:flex; flex-direction:column; gap:14px}
.setup-pair{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
.setup-pair .col{display:flex; flex-direction:column; gap:14px; min-width:0}
.theme-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(146px,1fr)); gap:10px}
.theme-card{
  border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:7px; cursor:pointer;
  background:color-mix(in srgb, var(--bg-2) 60%, transparent);
  display:flex; flex-direction:column; gap:7px; transition:border-color .15s, transform .15s, box-shadow .2s;
  width:100%; text-align:left;
}
.theme-card:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 45%, var(--border))}
.theme-card.selected{border-color:var(--accent); box-shadow:var(--glow)}
.theme-prev{height:54px; border-radius:7px; position:relative; overflow:hidden; border:1px solid color-mix(in srgb, var(--border) 70%, transparent)}
.theme-prev .tp-surface{position:absolute; left:8px; right:8px; bottom:8px; height:22px; border-radius:5px}
.theme-prev .tp-dots{position:absolute; top:8px; left:8px; display:flex; gap:4px}
.theme-prev .tp-dots i{width:9px; height:9px; border-radius:50%; display:block}
.theme-meta{display:flex; align-items:center; justify-content:space-between; padding:0 3px 2px}
.theme-meta b{font-size:12px}
.theme-meta span{font:600 9px var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted)}
.tweak-row{display:grid; grid-template-columns:130px 1fr 52px; align-items:center; gap:12px; padding:7px 0}
.tweak-row>label{font:600 12px var(--font-body); color:var(--text-muted)}
.tweak-row .val{font:600 11.5px var(--font-mono); color:var(--accent); text-align:right}
.color-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:8px}
.fx-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:9px}
.fx-card{
  border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:6px; cursor:pointer;
  display:flex; flex-direction:column; gap:6px; background:color-mix(in srgb, var(--bg-2) 60%, transparent);
  transition:border-color .15s, transform .15s, box-shadow .2s; width:100%;
}
.fx-card:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 45%, var(--border))}
.fx-card.selected{border-color:var(--accent); box-shadow:var(--glow)}
.fx-card b{font-size:11px; font-weight:700; text-align:center; padding-bottom:2px; color:var(--text-muted)}
.fx-card.selected b{color:var(--accent)}
.fx-prev{height:48px; border-radius:6px; background:var(--bg-2); border:1px solid color-mix(in srgb, var(--border) 70%, transparent); position:relative; overflow:hidden}
.fx-prev canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.dropzone{
  border:1.5px dashed color-mix(in srgb, var(--text-muted) 45%, transparent); border-radius:var(--radius-sm);
  padding:18px 14px; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center;
  color:var(--text-muted); cursor:pointer; transition:border-color .15s, background .15s;
}
.dropzone:hover{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 5%, transparent); color:var(--accent)}
.dropzone svg{width:19px;height:19px}
.dropzone b{font-size:12px}
.dropzone span{font:10.5px var(--font-mono)}
.dropzone .dz-thumb{width:100%; height:72px; border-radius:7px; object-fit:cover}
.setup-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid color-mix(in srgb, var(--border) 60%, transparent)}
.setup-row:last-child{border-bottom:none}
.setup-row .lbl{display:flex; flex-direction:column; gap:1px; min-width:0}
.setup-row .lbl b{font-size:12.5px}
.setup-row .lbl span{font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.setup-row .ctrl{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.setup-row .ctrl .input,.setup-row .ctrl .select{width:auto; min-width:120px}
.setup-row .ctrl .input.narrow{width:70px; min-width:70px; text-align:center}
.setup-bar{display:flex; align-items:center; gap:10px; padding:14px 0 6px; flex-wrap:wrap}

/* ─────────────────────── QR SAHNESİ (tam ekran, projeksiyon) ─────────────────────── */
#screen-qr{max-width:none; padding:0; height:100vh; overflow:hidden}
#screen-qr.active{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:28px}
.seg.seg-lg button{padding:10px 24px; font-size:15px; font-weight:700}
.qr-stage-box{background:#fff; padding:18px; border-radius:18px; line-height:0;
  box-shadow:var(--glow), 0 24px 60px color-mix(in srgb, var(--bg) 70%, transparent)}
.qr-stage-box canvas{display:block; width:min(50vh, 56vw); height:auto; image-rendering:pixelated}
.qr-stage-label{display:flex; align-items:center; gap:12px;
  font-family:var(--font-display); font-weight:800; font-size:28px; letter-spacing:.08em; text-transform:uppercase}
.qr-stage-label .dot{width:13px; height:13px; border-radius:50%}
.qr-stage-url{font:12.5px var(--font-mono); color:var(--text-muted); word-break:break-all; text-align:center}

/* ─────────────────────────── TOAST & MODAL ─────────────────────────── */
.toast-stack{position:fixed; right:18px; bottom:18px; z-index:60; display:flex; flex-direction:column; gap:8px}
.toast{
  display:flex; align-items:center; gap:10px; padding:11px 15px; min-width:230px; max-width:380px;
  background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(12px);
  border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:var(--radius-sm); font-size:12.5px; font-weight:600;
  box-shadow:0 10px 30px color-mix(in srgb, var(--bg) 70%, transparent);
  animation:toastIn .22s ease;
}
.toast.ok{border-left-color:var(--success)} .toast.err{border-left-color:var(--error)} .toast.warn{border-left-color:var(--warning)}
.toast.out{animation:toastOut .22s ease forwards}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes toastOut{to{opacity:0; transform:translateY(8px)}}
.modal-backdrop{
  position:fixed; inset:0; z-index:50; display:grid; place-items:center;
  background:color-mix(in srgb, var(--bg) 65%, transparent); backdrop-filter:blur(4px);
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.modal-backdrop.show{opacity:1; pointer-events:auto}
.modal{
  width:min(420px, calc(100vw - 48px)); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius); padding:22px;
  box-shadow:0 20px 60px color-mix(in srgb, var(--bg) 80%, transparent);
  transform:scale(.95); transition:transform .22s cubic-bezier(.2,1.2,.4,1);
}
.modal-backdrop.show .modal{transform:none}
.modal h3{font-size:16px; margin-bottom:6px}
.modal p{font-size:13px; color:var(--text-muted); margin-bottom:18px}
.modal .modal-actions{display:flex; justify-content:flex-end; gap:9px}
/* QR modalı: zemin her zaman beyaz (tarama güvenilirliği) */
.qr-modal{width:auto; max-width:min(560px, calc(100vw - 48px)); display:flex; flex-direction:column; align-items:center; gap:12px}
.qr-modal h3{margin-bottom:0}
.qr-box{background:#fff; padding:12px; border-radius:14px; line-height:0}
.qr-box canvas{display:block; max-width:min(440px, 70vw); height:auto; image-rendering:pixelated}
.qr-url{font-size:12px; color:var(--text-muted); word-break:break-all; text-align:center}
.qr-hint{font-size:12.5px; color:var(--text-muted); margin:0; text-align:center}
.qr-modal .modal-actions{justify-content:center; width:100%}

/* ─────────────────────────── SÜRE BİTTİ KATMANI ─────────────────────────── */
.timesup{position:fixed; inset:0; z-index:190; display:grid; place-items:center; opacity:1;
  background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(10px);
  animation:tuOverlayIn .25s ease}
@keyframes tuOverlayIn{from{opacity:0}}
.tu-inner{position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px}
.tu-flash{position:absolute; inset:-40vmax; background:radial-gradient(circle, color-mix(in srgb, var(--error) 35%, transparent), transparent 60%);
  opacity:.15; animation:tuFlash .5s ease-out}
@keyframes tuFlash{0%{opacity:.9; transform:scale(.5)}100%{opacity:.15; transform:scale(1)}}
.tu-text{font-family:var(--font-display); font-weight:800; font-size:clamp(60px,14vw,180px); letter-spacing:-.03em;
  color:var(--error); text-shadow:0 0 60px color-mix(in srgb, var(--error) 60%, transparent); line-height:.9;
  animation:tuPop .45s cubic-bezier(.2,1.4,.3,1)}
@keyframes tuPop{from{transform:scale(.6); opacity:0}}
.tu-sub{font-family:var(--font-mono); font-size:20px; color:var(--text-muted); animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px)}}
.tu-sub span{color:var(--error); font-weight:700}

/* ─────────────────────────── KILAVUZ DÜZENLEME ─────────────────────────── */
.gedit{width:100%; margin-top:8px}
textarea.gedit{resize:vertical; min-height:38px; font:inherit; line-height:1.5}
.guide-hero .gedit:first-child{margin-top:0}
.tip .gedit{margin-top:6px}
#guideEditBtn.active{color:var(--accent); border-color:var(--accent)}

/* ─────────────────────────── SAYAÇ (GERİ SAYIM) ─────────────────────────── */
#screen-countdownstage{max-width:none; padding:0; height:100vh; overflow:hidden}
/* sonuç tam-ekran sahnesi (sahneye yansıt) — uzun liste için kaydırılabilir */
#screen-resultstage{max-width:none; padding:0; height:100vh; overflow:auto}
#screen-resultstage.active{display:flex; justify-content:center}
.res-stage-full{width:100%; max-width:1080px; margin:auto; padding:54px 28px}
.cd-stage{position:relative; height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:space-between; padding:4vh 4vw; overflow:hidden}
.cd-logos{width:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:24px}
.cd-logos .cd-side{max-height:12vh; max-width:20vw; object-fit:contain}
.cd-logos .cd-side.r{justify-self:end}
.cd-logos .cd-center{max-height:30vh; max-width:46vw; object-fit:contain; justify-self:center}
.cd-logos .cd-center-ph{justify-self:center; align-self:center; border:2px dashed var(--border);
  border-radius:var(--radius); padding:4vh 6vw; color:var(--text-muted);
  font-family:var(--font-display); font-weight:800; letter-spacing:.2em; text-align:center}
.cd-bottom{display:flex; flex-direction:column; align-items:center; gap:1.4vh; padding-bottom:2.5vh}
.cd-phase{font-family:var(--font-display); font-weight:700; letter-spacing:.35em;
  font-size:clamp(14px,1.6vw,26px); color:var(--text-muted)}
.cd-digit-wrap{position:relative}
.cd-digits{position:relative; z-index:1; font-family:var(--font-display); font-weight:800;
  font-size:clamp(64px,13vw,250px); line-height:1; letter-spacing:.04em;
  font-variant-numeric:tabular-nums; display:flex; color:var(--text)}
/* sabit hane genişliği: rakam değişince sayaç yatayda OYNAMAZ */
.cd-d,.cd-sep{display:inline-block; text-align:center}
.cd-d{width:.64em}
.cd-sep{width:.38em}
.cd-ghost{display:none; position:absolute; inset:0; z-index:0; opacity:.1; pointer-events:none;
  font-size:clamp(64px,13vw,250px); font-weight:800; line-height:1; letter-spacing:.04em;
  font-variant-numeric:tabular-nums}
.cd-done-msg{font-family:var(--font-display); font-weight:800; font-size:clamp(28px,4.5vw,80px);
  color:var(--error); text-align:center; letter-spacing:.04em;
  text-shadow:0 0 40px color-mix(in srgb, var(--error) 55%, transparent);
  animation:cdFlash 1s steps(2,start) infinite}
@keyframes cdFlash{50%{opacity:.12}}
.cd-stage.done .cd-digits{color:var(--error)}
/* stiller — :is(.cd-digits,.cd-mini) hem sahnede hem stil seçici kartında geçerli */
.cd-style-neon :is(.cd-digits,.cd-mini){color:var(--accent);
  text-shadow:0 0 14px color-mix(in srgb, var(--accent) 75%, transparent),
              0 0 60px color-mix(in srgb, var(--accent) 40%, transparent)}
.cd-style-minimal :is(.cd-digits,.cd-mini){font-family:var(--font-body); font-weight:200; letter-spacing:.02em}
.cd-style-segment :is(.cd-digits,.cd-mini){font-family:var(--font-mono); font-weight:700; color:#ff7a18;
  text-shadow:0 0 16px rgba(255,122,24,.45)}
.cd-style-segment .cd-ghost{display:flex; font-family:var(--font-mono); font-weight:700; color:#ff7a18}
.cd-style-flip :is(.cd-digits,.cd-mini){gap:.06em}
.cd-style-flip .cd-d{background:var(--surface); border:1px solid var(--border); border-radius:.1em;
  padding:.1em .06em; box-shadow:inset 0 -.45em .9em rgba(0,0,0,.3), 0 .08em .25em rgba(0,0,0,.35);
  position:relative; overflow:hidden}
.cd-style-flip .cd-d::after{content:""; position:absolute; left:0; right:0; top:50%; height:1.5px;
  background:rgba(0,0,0,.45)}
.cd-style-flip .cd-sep{padding:.1em 0}
.cd-style-terminal :is(.cd-digits,.cd-mini){font-family:var(--font-mono); font-weight:700; color:#33ff66;
  text-shadow:0 0 12px rgba(51,255,102,.55)}
.cd-style-terminal.cd-stage::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.16) 2px 4px)}
.cd-cursor{display:none}
.cd-style-terminal .cd-cursor{display:inline-block; width:.45em; background:#33ff66; margin-left:.12em;
  animation:cdFlash 1.1s steps(2,start) infinite}
/* PIXEL (8-bit): rakamlar 5×7 piksel ızgarasından çizilir — gerçek retro */
.cd-d.cd-px{width:.78em; height:1em; display:grid; grid-template-columns:repeat(5,1fr);
  grid-auto-rows:1fr; gap:7%; padding:.02em 0}
.cd-px.sep{width:.5em}
.cd-px i{border-radius:18%}
.cd-px i.on{background:currentColor; box-shadow:0 0 .03em currentColor}
.cd-style-pixel :is(.cd-digits,.cd-mini){color:var(--accent); gap:.12em}
.cd-style-pixel.cd-stage::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 6px)}
/* GLITCH: RGB ayrışması + aralıklı arıza sıçramaları */
.cd-style-glitch :is(.cd-digits,.cd-mini){color:var(--text);
  text-shadow:.035em 0 var(--error), -.035em 0 var(--accent);
  animation:cdGlitch 2.4s steps(1) infinite}
@keyframes cdGlitch{
  0%,84%,100%{transform:none}
  86%{transform:translate(.02em,-.012em) skewX(4deg)}
  89%{transform:translate(-.018em,.008em) skewX(-3deg)}
  92%{transform:translate(.008em,0)}
  94%{transform:none}

const COLOR_VAR_MAP = {
  bg:"--bg", bg2:"--bg-2", surface:"--surface", surface2:"--surface-2", border:"--border",
  accent:"--accent", accent2:"--accent-2", accentInk:"--accent-ink", text:"--text", textMuted:"--text-muted",
  success:"--success", warning:"--warning", error:"--error"
};

/* Apply a theme object {colors, radius, glow, mode} to :root */
function applyTheme(theme){
  const root = document.documentElement;
  const colors = theme.colors || {};
  for(const k in COLOR_VAR_MAP){
    if(colors[k]) root.style.setProperty(COLOR_VAR_MAP[k], colors[k]);
  }
  // accent üstü metin rengi: preset vermiyorsa accent parlaklığından türet
  if(!colors.accentInk && colors.accent){
    root.style.setProperty("--accent-ink", modeForBg(colors.accent)==="light" ? "#10131c" : "#ffffff");
  }
  if(theme.radius != null){
    root.style.setProperty("--radius", theme.radius + "px");
    root.style.setProperty("--radius-sm", Math.max(2, Math.round(theme.radius*0.55)) + "px");
  }
  // glow config'te 0–2 float olarak saklanır; --glow-a yüzdesine eşlenir (1.0 → 30%)
  if(theme.glow != null){
    root.style.setProperty("--glow-a", Math.round(theme.glow*30) + "%");
  }
  const mode = theme.mode || (theme.preset && THEME_PRESETS[theme.preset] && THEME_PRESETS[theme.preset].mode) || "dark";
  root.setAttribute("data-mode", mode);
}

/* Merge a preset into a theme config block (preserving radius/glow) */
function themeFromPreset(presetKey, base){
  const p = THEME_PRESETS[presetKey] || THEME_PRESETS.frostbite;
  return {
    preset:presetKey,
    colors:{...p.colors},
    radius:(base && base.radius!=null)?base.radius:18,

/* Determine if a custom set of colors is light or dark (luminance of bg) */
function modeForBg(hex){
  const c = hex.replace("#","");
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  const lum=(0.2126*r+0.7152*g+0.0722*b)/255;
  return lum>0.5?"light":"dark";
}

/* Apply full config: theme + identity text + logo + background + effect */
function applyConfig(config){
  const t = {...config.theme};
  if(t.preset && t.preset!=="custom" && THEME_PRESETS[t.preset]){
    // keep stored colors if present, else fill from preset
    t.colors = t.colors && Object.keys(t.colors).length ? {...THEME_PRESETS[t.preset].colors, ...t.colors} : {...THEME_PRESETS[t.preset].colors};
    t.mode = THEME_PRESETS[t.preset].mode;
  } else if(t.colors && t.colors.bg){
    t.mode = modeForBg(t.colors.bg);
  }
  applyTheme(t);
  document.documentElement.style.setProperty("--name-size", (config.jam.nameSize||14)+"px");
  document.documentElement.style.setProperty("--tag-size", (config.jam.taglineSize||11)+"px");
  document.documentElement.style.setProperty("--name-font", config.jam.nameFont||"var(--font-display)");
  document.documentElement.style.setProperty("--tag-font", config.jam.taglineFont||"var(--font-body)");
  return t;
}

/* read current theme colors from CSS vars -> {accent, accent2, text, bg, ...} as hex */
function themeColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = v => cs.getPropertyValue(v).trim() || "#ffffff";
  return { accent:g("--accent"), accent2:g("--accent-2"), text:g("--text"),

function hexToRgb(hex){
  hex = (hex||"#000").replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");

  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };

/* ---------- CONTROLLER ----------
   Each controller owns a PRIVATE effect instance via Object.create, so every
   canvas (background + live preview + 14 gallery thumbnails) keeps its OWN
   particle state. Without this, all controllers would share Effects[name].p
   and the last/smallest init would shrink everyone's particle field. */
function makeEffectController(canvas){
  const ctx = canvas.getContext("2d");
  let cur="snow", inst=Object.create(Effects.snow), opts={count:150,speed:1}, raf=null, running=false, w=0,h=0, dpr=1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    if(w<1||h<1) return;            // skip until laid out — avoids clustered init
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(inst.init) inst.init(ctx,w,h,opts);
  }
  function loop(ts){ if(!running) return;
    if(w>0&&h>0) inst.frame(ctx,w,h,ts||0,opts);
    else resize();
    raf = requestAnimationFrame(loop);
  }
  function start(){ if(running) return; running=true; raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf)cancelAnimationFrame(raf); if(w>0&&h>0)ctx.clearRect(0,0,w,h); }

  function setEffect(name, intensity, speed){
    cur = Effects[name]?name:"none";
    inst = Object.create(Effects[cur]);   // fresh private instance for this controller
    if(intensity!=null) opts.count = Math.max(0, Math.round(intensity));
    if(speed!=null) opts.speed = speed;
    resize();
  }
  function setIntensity(v){ opts.count=Math.max(0,Math.round(v)); if(inst.init)resize(); }
  function setSpeed(v){ opts.speed=v; }
  function setEnabled(on){ on?start():stop(); }

  function onVis(){ document.hidden?stop():start(); }
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", onVis);
  function destroy(){
    stop();
    window.removeEventListener("resize", resize);
    document.removeEventListener("visibilitychange", onVis);
  }

  resize();
  return { setEffect, setIntensity, setSpeed, setEnabled, start, stop, resize, destroy,
    get current(){return cur} };
}

function mockCover(seed){
  // deterministic gradient SVG data url -> graceful, no network
  const hues=[(seed*47)%360,(seed*47+60)%360];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='hsl(${hues[0]},70%,22%)'/>
      <stop offset='1' stop-color='hsl(${hues[1]},75%,12%)'/></linearGradient></defs>
    <rect width='600' height='800' fill='url(#g)'/>
    <circle cx='${120+seed*37%360}' cy='${180+seed*53%420}' r='${90+seed*13%120}' fill='hsla(${hues[0]},80%,60%,.18)'/>
    <circle cx='${380+seed*29%180}' cy='${520+seed*41%200}' r='${60+seed*17%90}' fill='hsla(${hues[1]},80%,60%,.16)'/>
  </svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg).replace(/'/g,"%27");
}

function buildMockGames(){
  const games=[];
  for(let i=0;i<24;i++){
    const team=TEAM_WORDS[i%TEAM_WORDS.length]+" "+["Studio","Collective","Labs","Works","Team","Crew"][i%6];
    const game=GAME_WORDS[i%GAME_WORDS.length]+(i%5===0?" "+["II","Zero","X","Prime"][i%4]:"");
    const engine=ENGINES[i%ENGINES.length];
    const multi = i%4===0; // some have multiple exes
    const exes = multi?["Game.exe","Launcher.exe","x64/Game.exe"]:[`${game.replace(/\s/g,"")}.exe`];
    const hasCover = i%7!==3; // some missing cover -> placeholder
    games.push({ id:"g"+i, team, game, cover:hasCover?mockCover(i+1):null,
      exes, currentExe:0, engine });
  }
  return games;
}

/* ---------- event emitter ---------- */
function makeEmitter(){
  const map={};
  return {
    on(ev,cb){ (map[ev]||(map[ev]=[])).push(cb); return ()=>{ map[ev]=map[ev].filter(f=>f!==cb); }; },
    emit(ev,payload){ (map[ev]||[]).forEach(cb=>{ try{cb(payload)}catch(e){console.error(e)} }); }
  };
}

          const g=`${GAME_WORDS[i%GAME_WORDS.length]} by ${TEAM_WORDS[i%TEAM_WORDS.length]}`;

          if(Math.random()<0.08) em.emit("log",{channel:"download",level:"warning",line:`  retried chunk for ${g}`});
        }
        em.emit("log",{channel:"download",level:"success",line:"All downloads complete ✓"});
        em.emit("download:done",{ok:true});
        // gerçek backend gibi: indirme bitince organize otomatik zincirlenir
        Bridge.organizeFiles();

      return Promise.resolve({ok:true});

        const total=24; let bad=0;
        em.emit("log",{channel:"verify",level:"info",line:"Verifying archive integrity…"});
        for(let i=1;i<=total;i++){
          await wait(120);
          const ok=Math.random()>0.1;
          if(ok) em.emit("log",{channel:"verify",level:"success",line:`OK  [${i}/${total}] entry_${i}.zip`});
          else { bad++; em.emit("log",{channel:"verify",level:"error",line:`BAD [${i}/${total}] entry_${i}.zip — CRC mismatch`}); }
        }
        em.emit("log",{channel:"verify",level:bad?"warning":"success",line:`Done · ${total-bad} OK, ${bad} corrupt`});
      })();
      return wait(120*24+200).then(()=>({ok:true,corrupt:0}));
    },

      let extracted=0,fixed=0,removed=0;
      (async()=>{
        const total=24;
        em.emit("log",{channel:"organize",level:"info",line:"Scanning JamGames directory…"});
        for(let i=1;i<=total;i++){
          await wait(150);
          const r=Math.random();
          if(r<0.6){ extracted++; em.emit("log",{channel:"organize",level:"success",line:`[UNZIP] entry_${i}.zip → ${i} files`}); }
          else if(r<0.78){ extracted++; em.emit("log",{channel:"organize",level:"success",line:`[WINRAR] entry_${i}.rar extracted`}); }
          else if(r<0.92){ fixed++; em.emit("log",{channel:"organize",level:"info",line:`[FIX] flattened nested folder for entry_${i}`}); }
          else { removed++; em.emit("log",{channel:"organize",level:"warning",line:`[CLEAN] removed junk folder entry_${i} (no .exe)`}); }
        }
        em.emit("log",{channel:"organize",level:"success",line:`Done ✓ ${extracted} extracted, ${fixed} fixed, ${removed} removed`});
        em.emit("organize:done",{extracted,fixed,removed});

    scanGames(){ return wait(500).then(()=>buildMockGames()); },
    setGameInfo(gid,name,team){ this.__overrides=this.__overrides||{}; this.__overrides[gid]={name,team}; return wait(80).then(()=>({ok:true})); },

    launchGame(gameId,exeIndex,minutes){
      // start a countdown timer that emits ticks + timesup
      if(timerHandle) clearInterval(timerHandle);
      let remaining = Math.round((minutes||config.launcher.defaultMinutes)*60);
      em.emit("timer:tick",{remaining});
      timerHandle=setInterval(()=>{
        remaining--;
        em.emit("timer:tick",{remaining});
        if(remaining<=0){ clearInterval(timerHandle); timerHandle=null; em.emit("timer:timesup",{}); }
      },1000);
      return Promise.resolve({ok:true});
    },
    stopGame(){ if(timerHandle){clearInterval(timerHandle);timerHandle=null;} em.emit("game:closed",{}); return Promise.resolve({ok:true}); },

    // demo helper to launch a short timer quickly (not part of real API)
    _demoTimer(seconds){
      if(timerHandle) clearInterval(timerHandle);
      let remaining=seconds;
      em.emit("timer:tick",{remaining});
      timerHandle=setInterval(()=>{ remaining--; em.emit("timer:tick",{remaining});
        if(remaining<=0){clearInterval(timerHandle);timerHandle=null;em.emit("timer:timesup",{});} },1000);
    }
  };
  return Bridge;
}
